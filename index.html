function photoFail23(img){
 if(!img || img.dataset.failed23==='yes')return;
 img.dataset.failed23='yes'; img.style.visibility='hidden';
 const target=img.parentElement;
 if(!target)return;
 target.classList.add('photo-failed23');
 if(getComputedStyle(target).position==='static')target.style.position='relative';
 const fallback=document.createElement('div');
 fallback.className='photo-error23';fallback.setAttribute('role','status');
 const label=(img.getAttribute('alt')||'이 장소').replace(/ 사진$| 큰 사진$| 여행 사진$/,'');
 fallback.textContent=label+' · 사진 연결 확인 필요';
 target.insertBefore(fallback,img.nextSibling);
}

  const duration=Number.isFinite(p.duration)?Math.max(10,Math.min(480,Math.round(p.duration))):60;
  const hours=opening(p)||{open:0,close:1440};
  if(hours.closed){unplaced.push({id:p.id,reason:'선택한 날짜에 휴관 또는 관람 불가'});continue;}
  let placed=false;
  for(let i=minIndex;i<slots.length;i++){
   const slot=slots[i];
   const previous=scheduled.length&&scheduled[scheduled.length-1]._slot===i?scheduled[scheduled.length-1]:null;
   const minStart=Math.max(slot.start,Number(hours.open??0),previous?toMinutes(previous.end)+restBuffer:slot.start);
   const travel=Number.isFinite(p.transfer)?Math.max(8,Math.min(120,p.transfer)):transferBuffer;
   const candidateStart=minStart+(previous?travel:transferBuffer);
   const candidateEnd=candidateStart+duration;
   const deadline=Math.min(slot.end,Number(hours.close??1440))-(slot.nextEvent?transferBuffer:0);
   if(candidateEnd<=deadline){
    scheduled.push({...p,start:toClock(candidateStart),end:toClock(candidateEnd),transfer:travel,routeMethod:'live-preview-estimate',_slot:i});
    slots[i].start=candidateEnd+restBuffer;minIndex=i;placed=true;break;
   }
  }
  if(!placed)unplaced.push({id:p.id,reason:'남은 관광시간·예약 도착 여유·운영시간 안에 배치할 수 없음'});
 }
 const entries=[...scheduled.map(({_slot,...rest})=>rest),...unchangedEvents].sort((a,b)=>toMinutes(a.start)-toMinutes(b.start)||(a.type==='event'?-1:1));
 if(unplaced.length)warnings.push(`${unplaced.length}곳은 오늘 남은 일정에 배치하지 못했습니다. 삭제되거나 방문 완료 처리되지는 않습니다.`);
 warnings.push('이동·관람시간은 추정치입니다. 현지 교통과 운영시간은 별도로 확인하세요.');
 return {errors,warnings,entries,unplaced,unchangedEvents,planned:scheduled.length,remaining:places.length,now,dayStart,dayEnd};
}

/** ViennaNow Phase 14 — local-time trip schedule builder (Europe/Vienna civil dates).
 * This module does not verify ticket availability or public transport. Coordinates remain approximate.
 */
const DEFAULT_WINDOW = Object.freeze({start:'09:30',end:'18:00'});
function clockMinutes(value){
  if(typeof value!=='string'||!/^([01]\d|2[0-3]):[0-5]\d$/.test(value))return NaN;
  const [h,m]=value.split(':').map(Number);return h*60+m;
}
function timeText(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;}
function addDate(date,n){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error('유효한 날짜가 아닙니다.');
  const d=new Date(`${date}T12:00:00Z`);
  if(Number.isNaN(d.getTime())||d.toISOString().slice(0,10)!==date)throw Error('유효한 날짜가 아닙니다.');
  d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);
}
function tripDates(start,days){
  if(!Number.isInteger(days)||days<1||days>5)throw Error('여행 기간은 1~5일이어야 합니다.');
  return Array.from({length:days},(_,i)=>addDate(start,i));
}
function windowsFor(start,days,windows={}){
  return tripDates(start,days).map(date=>({date,...DEFAULT_WINDOW,...(windows[date]||{})}));
}

  for(const date of dates){

    if(!Number.isFinite(a)||!Number.isFinite(b)||b<=a)errors.push(`${date}: 관광 시작·종료 시각을 다시 확인하세요.`);
    byDay[date]={start:a,end:b,events:[]};
  }
  const seen=new Set();
  for(const ev of fixedEvents){
    if(!ev||typeof ev.id!=='string'||!ev.id||seen.has(ev.id)){errors.push('예약 식별자가 올바르지 않습니다.');continue;}
    seen.add(ev.id);
    if(!dates.includes(ev.date)){errors.push(`${ev.title||'예약'}: 여행 기간 밖의 날짜입니다.`);continue;}
    const a=clockMinutes(ev.start),b=clockMinutes(ev.end),before=Number(ev.bufferBefore??30),after=Number(ev.bufferAfter??15);
    if(!ev.title?.trim()||ev.title.length>90||!Number.isFinite(a)||!Number.isFinite(b)||b<=a||!Number.isInteger(before)||!Number.isInteger(after)||before<0||before>120||after<0||after>120){errors.push(`${ev.title||'예약'}: 시간 또는 여유시간이 올바르지 않습니다.`);continue;}
    byDay[ev.date].events.push({...ev,_start:a,_end:b,_before:before,_after:after});
    if(b<=byDay[ev.date].start||a>=byDay[ev.date].end)warnings.push(`${ev.title}: 관광 가능 시간 밖의 예약입니다. 일정표에는 그대로 표시합니다.`);
  }
  for(const date of dates){
    const events=byDay[date].events.sort((x,y)=>x._start-y._start);
    for(let i=1;i<events.length;i++){
      if(events[i]._start-events[i]._before < events[i-1]._end+events[i-1]._after){
        errors.push(`${date}: '${events[i-1].title}'와 '${events[i].title}'의 예약·여유시간이 겹칩니다.`);
      }

function distKm21(lat1,lon1,lat2,lon2){const r=Math.PI/180,dlat=(lat2-lat1)*r,dlon=(lon2-lon1)*r;return 6371*2*Math.asin(Math.sqrt(Math.sin(dlat/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dlon/2)**2))}

async function fetchAsJson(url,controller){const r=await fetch(url,{mode:'cors',signal:controller.signal,headers:{Accept:'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function startFetch(kind){if(!FACILITIES[kind]||loadingFacility===kind)return;let reqId=++fetchId;loadingFacility=kind;
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),16000);
 const proxyUrl='/api/ogd?layer='+encodeURIComponent(kind);
 const canUseProxy=location.protocol!=='file:'&&!['localhost','127.0.0.1'].includes(location.hostname);
 let failures=[];
 try{
  let data;
  if(canUseProxy){try{data=await fetchAsJson(proxyUrl,controller);if(data.status!=='ok')throw new Error(data.message||'proxy not available');}catch(e){failures.push('서버 함수: '+e.message);}}
  if(!data){throw new Error(canUseProxy?'서버 함수 연결에 실패했습니다. Cloudflare에서 Functions 상태를 확인하세요.':'파일 실행/로컬 환경에서는 서버 함수를 사용할 수 없습니다. Cloudflare 배포 후 점검하세요.');}
  if(data.status!=='ok'||!Array.isArray(data.points))throw Error('올바른 공공데이터 형태가 아닙니다');
  loadedFacilities[kind]=data;
 }catch(e){loadedFacilities[kind]={status:'failed',message:([...failures,String(e.message||e)]).join(' / ')};}
 finally{clearTimeout(timer);if(reqId===fetchId){loadingFacility=null;if(state.facility===kind&&state.tab==='map')render();}}
}
async function runDiagnostic(layer){
 if(!['wc','water','stops'].includes(layer))return;
 if(location.protocol==='file:'){toast('Cloudflare 배포 사이트에서만 서버 연결을 점검할 수 있습니다.');return;}
 state.diagnostics[layer]={message:'점검 중...'};render();
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),11000);
 try{
  const res=await fetch('/api/diagnostics?layer='+encodeURIComponent(layer),{signal:controller.signal});
  const raw=await res.json();
  if(!res.ok||raw.status==='error')throw Error(raw.message||'HTTP '+res.status);
  state.diagnostics[layer]={message:raw.status==='ok'?`표본 ${raw.rawFeatures}건 중 유효 ${raw.usableFeatures}건 · ${raw.checkedAt.slice(0,16).replace('T',' ')} UTC`:`응답 수신, 유효 표본 없음 (${raw.rawFeatures||0}건)`,status:raw.status};
 }catch(e){state.diagnostics[layer]={message:'연결 실패: '+String(e.message||e),status:'error'};}
 finally{clearTimeout(timer);if(state.tab==='guide')render();}
}
function useGps(){if(!navigator.geolocation){toast('현재 위치 기능을 지원하지 않습니다');return;}

  let loc={lat:coords.latitude,lon:coords.longitude,label:'내 위치 (GPS로 선택됨)'};
  if(!Number.isFinite(loc.lat)||!Number.isFinite(loc.lon)){toast('유효하지 않은 위치입니다');return;}

}
async function apiWalkingLeg(from,to){
  const url='/api/route?'+new URLSearchParams({from:from.id,to:to.id}).toString();
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),14000);
  try{
    const response=await fetch(url,{headers:{Accept:'application/json'},signal:controller.signal});
    const data=await response.json().catch(()=>({status:'error',message:'서버가 JSON을 반환하지 않았습니다.'}));
    if(!response.ok||data.status!=='ok')throw Error(data.message||`도보 경로 조회 HTTP ${response.status}`);
    if(data.from!==from.id||data.to!==to.id||data.mode!=='walking'||!Number.isInteger(data.durationMinutes)||data.durationMinutes<1||data.durationMinutes>180)throw Error('경로 응답 검증 실패');
    return {minutes:data.durationMinutes,mode:'walking',source:'ors-walking',savedAt:data.checkedAt||new Date().toISOString(),distanceMeters:data.distanceMeters,locationStatus:'approximate-venue-coordinates'};
  }finally{clearTimeout(timer)}
}

async function autoDayWalk(){

  const timeline=state.itinerary?.timelines?.[state.currentDay]||stops.map(x=>({...x,type:'place'}));const legs=timeline.slice(1).map((s,i)=>[timeline[i],s]).filter(([a,b])=>a.type==='place'&&b.type==='place').map(([a,b])=>[byId(a.id),byId(b.id)]).filter(([a,b])=>a&&b);

  if(!list.length){toast('모든 구간에 사용자 입력 이동시간이 있습니다. 자동으로 덮어쓰지 않습니다.');return;}

window.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(state.expDetail19){state.expDetail19=null;state.expPlan19=null;render()}else if(state.explore19){state.explore19=false;render()}else if(state.settingsOpen){state.settingsOpen=false;render()}else if(state.detail){state.detail=null;render()}else if(state.routeEdit){state.routeEdit=null;render()}else if(state.guideTopic){state.guideTopic=null;render()}else if(state.homeGuide){state.homeGuide=false;state.guideTopic=null;render()}else if(state.homeView==='explore'){state.homeView='overview';render()}});
render();


</script></body></html>
