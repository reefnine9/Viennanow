name: ViennaNow mobile browser QA
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployed_url:
        description: 'Optional verified Cloudflare Pages production URL (HTTPS)'
        required: false
        type: string
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 leaflet@1.9.4
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public > /tmp/viennanow-server.log 2>&1 &
          echo $! > /tmp/viennanow-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run mobile and language browser checks
        run: node scripts/mobile-browser-qa.mjs
      - name: Phase 11 interaction and favorite persistence QA
        run: node scripts/interaction-qa.mjs
      - name: Phase 13 restaurant and Leaflet marker interactions
        run: node scripts/phase13-browser-qa.mjs
      - name: Phase 14 media attribution audit
        run: node scripts/phase14-media-audit.mjs
      - name: Phase 16 broken-photo fallback browser checks
        run: node scripts/phase16-photo-fallback-qa.mjs
      - name: Phase 12 local HTTP asset integrity
        run: node scripts/deploy-qa.mjs
      - name: Phase 12 optional live Cloudflare HTTP checks
        if: inputs.deployed_url != ''
        env:
          VIENNANOW_DEPLOY_URL: ${{ inputs.deployed_url }}
        run: node scripts/deploy-qa.mjs
      - name: Phase 12 production site observation
        continue-on-error: true
        run: node scripts/deploy-qa.mjs --url=https://viennanow.pages.dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-browser-qa
          path: |
            artifacts/mobile-qa/
            artifacts/interaction-qa/
            artifacts/deploy-qa/
            artifacts/phase13/
            artifacts/phase14/
            artifacts/phase15/
            artifacts/phase16/
          if-no-files-found: warn
