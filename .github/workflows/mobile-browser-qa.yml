name: ViennaNow mobile browser QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public > /tmp/viennanow-server.log 2>&1 &
          echo $! > /tmp/viennanow-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run mobile and language browser checks
        run: node scripts/mobile-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-browser-qa
          path: artifacts/mobile-qa/
          if-no-files-found: warn
