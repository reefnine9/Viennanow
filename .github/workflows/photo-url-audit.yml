name: ViennaNow photo URL audit (on demand)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  photo-links:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe external photo links (advisory only)
        env:
          PHOTO_AUDIT_TIMEOUT_MS: '9000'
        run: node scripts/phase15-photo-url-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-url-audit
          path: artifacts/phase15/photo-url-report.json
          if-no-files-found: warn
