name: Google Play signed AAB
on:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'scripts/configure-android-test-ads.mjs'
      - 'functions/api/ogd.js'
      - '.github/workflows/google-play-aab.yml'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (must exceed all previously uploaded Play builds)'
        required: true
        default: '5'
        type: string
      api_origin:
        description: 'Production Cloudflare API origin'
        required: true
        default: 'https://viennanow.pages.dev'
        type: string
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Verify signing configuration
        env:
          ENCRYPTED_KEYSTORE_B64: ${{ secrets.ANDROID_ENCRYPTED_KEYSTORE_BASE64 }}
          BACKUP_PASSWORD: ${{ secrets.ANDROID_KEY_BACKUP_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ENCRYPTED_KEYSTORE_B64" || { echo "::error::Missing ANDROID_ENCRYPTED_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$BACKUP_PASSWORD" || { echo "::error::Missing ANDROID_KEY_BACKUP_PASSWORD secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
      - name: Install dependencies and generate icons
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund typescript@5.9.3
          npm run icons:generate
      - name: Run source checks
        run: |
          npm test
          npm run check
          npm run check:stores
          npm run check:native:release
      - name: Generate Android project
        run: npm run native:add:android
      - name: Set Google Play minimum Android SDK to 24
        run: |
          sed -i -E 's/(minSdkVersion[[:space:]]*=[[:space:]]*)23/\124/' android/variables.gradle
          grep -Eq 'minSdkVersion[[:space:]]*=[[:space:]]*24' android/variables.gradle || { echo '::error::Could not set minSdkVersion to 24'; exit 1; }
      - name: Configure Android API 36 for Google Play
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
          sed -i -E 's/(compileSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\136/; s/(targetSdkVersion[[:space:]]*=[[:space:]]*)[0-9]+/\136/' android/variables.gradle
          grep -Eq 'compileSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
      - name: Sync bundled app
        env:
          VIENNANOW_API_ORIGIN: ${{ inputs.api_origin || 'https://viennanow.pages.dev' }}
        run: npm run native:sync
      - name: Configure Google test banner and consent
        run: node scripts/configure-android-test-ads.mjs
      - name: Set unique Google Play version code
        env:
          PLAY_VERSION_CODE: ${{ inputs.version_code || '5' }}
        run: |
          if ! [[ "$PLAY_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || (( PLAY_VERSION_CODE > 2100000000 )); then
            echo "::error::version_code must be a positive Android-compatible integer"; exit 1
          fi
          sed -i -E "s/(versionCode[[:space:]]+)[0-9]+/\\1${PLAY_VERSION_CODE}/" android/app/build.gradle
          grep -Eq "versionCode[[:space:]]+${PLAY_VERSION_CODE}([^0-9]|$)" android/app/build.gradle || { echo "::error::Could not set Android versionCode"; exit 1; }
          echo "AAB will use versionCode=${PLAY_VERSION_CODE}"
          echo "NOTE: Play Console rejects any versionCode already uploaded."
      - name: Prepare secure signing
        env:
          ENCRYPTED_KEYSTORE_B64: ${{ secrets.ANDROID_ENCRYPTED_KEYSTORE_BASE64 }}
          BACKUP_PASSWORD: ${{ secrets.ANDROID_KEY_BACKUP_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$ENCRYPTED_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/viennanow-upload.jks.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in "$RUNNER_TEMP/viennanow-upload.jks.enc" -out "$RUNNER_TEMP/viennanow-upload.jks" -pass env:BACKUP_PASSWORD
          rm -f "$RUNNER_TEMP/viennanow-upload.jks.enc"
          test -s "$RUNNER_TEMP/viennanow-upload.jks"
          cat >> android/gradle.properties <<EOF
          VIENNANOW_RELEASE_STORE_FILE=$RUNNER_TEMP/viennanow-upload.jks
          VIENNANOW_RELEASE_STORE_PASSWORD=$STORE_PASSWORD
          VIENNANOW_RELEASE_KEY_ALIAS=$KEY_ALIAS
          VIENNANOW_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  viennanowRelease {
                      storeFile file(project.property("VIENNANOW_RELEASE_STORE_FILE"))
                      storePassword project.property("VIENNANOW_RELEASE_STORE_PASSWORD")
                      keyAlias project.property("VIENNANOW_RELEASE_KEY_ALIAS")
                      keyPassword project.property("VIENNANOW_RELEASE_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.viennanowRelease
                  }
              }
          }
          EOF
      - name: Build signed Google Play AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: viennanow-google-play-signed-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
