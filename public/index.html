const LONG_GUIDES48={"A01":{"p":["비엔나의 중심이 어디냐고 묻는다면 많은 사람이 슈테판 대성당을 가리킬 것이다. 좁은 구시가지 골목을 걷다가 갑자기 거대한 고딕 첨탑이 나타나는 순간은 비엔나 여행의 가장 인상적인 장면 중 하나다. 성당의 역사는 12세기까지 거슬러 올라간다. 여러 세기에 걸쳐 증축되고 복구되면서 오늘날의 모습을 갖췄으며, 도시의 중요한 종교 행사와 역사적 순간을 지켜왔다.","특히 지붕을 눈여겨보자. 색색의 기와가 기하학적인 무늬와 독수리 문양을 만들고 있어, 검은 석재로 지어진 성당의 인상을 완전히 바꾸어 놓는다. 내부에는 고딕식 기둥, 조각상, 제단과 오랜 세월의 흔적이 남아 있다. 더욱 특별한 경험을 원한다면 남쪽 탑의 343개 계단을 오르거나 북쪽 탑에서 거대한 푸머린 종과 구시가지 풍경을 감상할 수 있다. 지하 카타콤베를 둘러보는 투어도 다른 분위기의 체험이다.","이곳은 지금도 예배가 열리는 성당이다. 조용한 관람과 종교 행사에 대한 배려가 필요하며, 전망대·카타콤베는 별도 입장 조건이 있다. 슈테판 광장에서 정면과 옆면을 모두 감상한 뒤 그라벤 거리로 이어서 걷는 코스를 추천한다."],"h":"독특한 지붕, 남쪽 첨탑, 성당 내부, 탑 전망.\n**권장 체류:** 외관 위주 20~30분, 내부·탑 포함 1~2시간.","t":""},"A02":{"p":["호프부르크는 한눈에 전체가 보이는 하나의 궁전이 아니다. 광장과 정원, 오래된 건물들이 여러 세기에 걸쳐 덧붙여진 거대한 황실 도시 같은 공간이다. 중세부터 1918년 제국이 끝날 때까지 합스부르크 왕가의 권력 중심지였으며, 오늘날에도 오스트리아 대통령의 집무 공간 등 공적인 역할을 이어간다. 넓은 영웅광장에 서면 '비엔나가 왜 한때 거대한 제국의 수도였을까'라는 질문이 자연스럽게 떠오른다.","왕궁에서는 황실의 서로 다른 모습을 발견할 수 있다. 시시 박물관은 황후 엘리자베트의 개인적인 삶을, 황실 보물관은 통치 권력과 의례를 상징하는 보물을 보여준다. 스페인 승마학교에서는 황실 시대에 뿌리를 둔 전통 승마 문화를 접할 수 있다. 오스트리아 국립도서관 프룽크잘도 이 복합 건축군과 연결되어 있다. 따라서 '호프부르크 입장권 하나로 모두 볼 수 있다'고 생각하면 곤란하다. 각 시설의 관람 조건이 다르다.","시간이 넉넉하지 않다면 미하엘러 광장에서 왕궁으로 들어와 내부 안뜰과 영웅광장을 둘러보고, 외관이 멋진 신왕궁 앞에서 사진을 찍어보자. 왕궁의 진짜 매력은 한 채의 화려한 건물보다 수백 년의 역사가 켜켜이 포개져 있다는 데 있다."],"h":"미하엘러 문, 왕궁 안뜰, 영웅광장, 관심 분야에 맞는 박물관.\n**권장 체류:** 외부 산책 45~60분, 내부 시설을 넣으면 반나절 이상.","t":""},"A03":{"p":["쇤브룬은 화려한 관광지가 되기 전, 합스부르크 황실 가족이 실제로 머물던 여름 궁전이었다. 지금도 밝은 노란빛 외벽 앞에 서면 마차가 들어오고 궁정 사람들이 오가던 장면을 상상하게 된다. 특히 18세기 마리아 테레지아 시대에 왕실을 대표하는 궁전으로 발전했으며, 뒤이어 프란츠 요제프 황제와 엘리자베트 황후 '시시'의 일상과도 깊이 연결되었다.","궁전 내부에서는 권력의 화려함과 개인의 생활이 묘하게 대비된다. 황금 장식과 샹들리에가 눈부신 대갤러리에서는 외교적 행사와 궁정의 위엄을 느낄 수 있다. 반면 황제의 생활 공간에서는 상대적으로 소박하고 규칙적이었던 프란츠 요제프의 모습을 떠올리게 된다. 시시의 방에 얽힌 이야기를 알고 둘러보면, 황후의 아름다운 초상화 뒤에 있었던 답답한 궁정 생활도 조금 더 가까이 다가온다.","궁전 뒤 정원은 꼭 걸어보자. 중앙 축을 따라 꽃밭과 조각상이 이어지고, 넵튠 분수 너머 언덕 정상에 글로리에테가 보인다. 천천히 언덕을 오르면 궁전 전체와 비엔나 시내가 한눈에 펼쳐진다. 내부 관람이 부담스럽다면 넓은 무료 정원만 산책하는 것도 좋다. 단, 일부 정원 시설은 유료이며 계절에 따라 개방시간이 달라진다."],"h":"대갤러리, 황실 생활 공간, 넵튠 분수, 글로리에테 전망.\n**권장 체류:** 내부와 정원 3~4시간, 정원 중심 1~2시간.","t":""},"A04":{"p":["벨베데레를 방문하는 사람들의 첫 번째 목표는 대개 구스타프 클림트의 《키스》다. 하지만 이곳은 세계적인 미술관이기 전에 사보이 공자 외젠이 자신의 지위와 취향을 보여주기 위해 지은 바로크 여름 궁전이었다. 정원을 사이에 두고 상궁과 하궁이 마주하는 배치는 정교하게 계산된 하나의 거대한 무대처럼 보인다.","상벨베데레의 대표 작품 《키스》는 두 사람이 금빛 장식 안에서 포옹하는 장면이다. 실제 작품 앞에서는 화면 사진으로 보기 어려운 금빛 표면의 질감과 섬세한 무늬가 눈에 들어온다. 클림트와 에곤 실레의 작품을 함께 보면 황실의 전통이 강했던 비엔나에서 새로운 예술 언어가 어떻게 탄생했는지 느낄 수 있다. 미술을 잘 모르더라도 인물의 표정과 색채를 비교해보는 것만으로 충분히 재미있다.","전시실 사이사이 궁전 자체도 놓치지 말자. 특히 대리석 홀은 1955년 오스트리아 국가조약이 체결된 역사적 장소다. 관람 후 정원으로 나오면 분수와 조각상, 대칭적인 길이 멋진 풍경을 만든다. 상벨베데레와 하벨베데레는 서로 다른 관람 시설이므로 예매할 때 구분해야 한다."],"h":"클림트의 《키스》, 실레 작품, 대리석 홀, 정원.\n**권장 체류:** 2~3시간.","t":""},"A05":{"p":["비엔나가 '음악의 도시'라는 사실을 가장 실감할 수 있는 곳 중 하나가 국립오페라극장이다. 링슈트라세에 자리한 이 웅장한 건물에서는 오페라와 발레가 끊임없이 무대에 오른다. 외관은 19세기 황실 비엔나의 품격을 보여주지만, 이 건물은 전쟁의 아픔도 겪었다. 1945년 공습으로 큰 피해를 입었고, 1955년 재개관은 전후 비엔나 문화의 회복을 상징하는 중요한 사건이 되었다.","오페라를 한 번도 본 적이 없어도 겁낼 필요는 없다. 공연의 줄거리를 미리 조금 읽고, 화려한 무대 장치와 관현악의 소리, 관객이 함께 숨을 고르는 순간을 경험하는 것만으로도 특별하다. 공연을 보지 않는 여행자라면 가이드 투어로 객석과 건축 공간을 살펴보는 방법도 있다. 다만 투어의 접근 가능 구역은 공연과 리허설 일정에 따라 달라질 수 있다.","이곳은 근처 알베르티나, 카페, 케른트너 거리와 묶기에도 좋다. 밤 공연을 예약했다면 미리 입장시간과 공연 길이, 복장에 관한 공식 안내를 확인하자. '비엔나에 왔다'는 느낌을 가장 강하게 주는 저녁을 만들 수 있다."],"h":"외관의 아치와 로지아, 내부 객석, 실제 오페라·발레 공연.\n**권장 체류:** 외관 15분, 가이드 투어 약 40분, 공연은 작품별 상이.","t":""},"A06":{"p":["미술사박물관은 그림만 보는 곳이 아니다. 황제들이 수백 년 동안 모은 유럽 최고의 예술과 진귀한 물건들을 통해 합스부르크 왕가의 취향과 권력을 읽는 장소다. 건물 안으로 들어서면 중앙 계단과 거대한 돔, 대리석 장식이 먼저 눈길을 붙잡는다. 전시실에 들어가기 전부터 이미 '황실이 만든 예술의 궁전'을 만난 셈이다.","그림에서는 피터르 브뤼헐의 작품을 꼭 찾아보자. 수많은 사람이 서로 다른 행동을 하는 장면들을 가까이 들여다보면 작은 이야기들이 끝없이 나타난다. 베르메르, 루벤스, 티치아노 등 유럽 미술사의 거장들도 만날 수 있다. 특별한 물건을 좋아한다면 황실 공예품을 모은 쿤스트카머(Kunstkammer)에도 시간을 배분해보자. 값비싼 재료와 놀라운 세공 기술은 옛 사람들이 무엇을 경이롭다고 여겼는지를 말해준다.","컬렉션이 방대하므로 모든 전시실을 완벽하게 보려는 계획은 오히려 지치기 쉽다. 처음 방문한다면 브뤼헐의 그림, 대표 회화 몇 점, 웅장한 중앙 홀을 중심으로 일정을 짜보자. 맞은편 자연사박물관과 마리아 테레지아 광장까지 함께 보면 도시 설계가 만들어낸 장엄함도 느낄 수 있다."],"h":"브뤼헐의 작품, 쿤스트카머, 중앙 계단과 돔.\n**권장 체류:** 2~4시간.","t":""},"A07":{"p":["알베르티나는 오페라극장 옆의 평범한 미술관이 아니라, 황실의 오래된 궁전 공간과 세계적으로 유명한 그래픽 아트 컬렉션이 만나는 곳이다. 이름은 작센테셴의 알베르트 공작에서 비롯되었다. 드로잉과 판화는 완성된 유화만큼 눈에 띄지 않을지 몰라도, 예술가의 아이디어가 어떻게 한 장의 종이 위에서 시작되는지를 보여준다.","알베르티나의 소장품에는 뒤러의 유명한 《어린 토끼》를 비롯해 귀중한 작품이 포함된다. 다만 종이 작품은 빛에 민감해서 유명 소장품이라고 해도 항상 원본이 전시되어 있는 것은 아니다. 방문 전에 현재 전시를 확인해야 한다. 상설 컬렉션의 근현대 회화와 기획전을 둘러보는 재미도 크다. 화려하게 복원된 합스부르크 시대의 궁정 객실에서는 이 공간이 원래 귀족의 거주지였다는 사실을 실감할 수 있다.","건물 바깥 테라스도 놓치기 아깝다. 오페라극장과 주변 시내를 내려다보는 사진 명소로 인기 있으며, 미술관에 들어가지 않고도 주변 산책에 자연스럽게 포함할 수 있다. 시간이 부족하면 현재 전시에서 가장 관심 있는 주제 하나를 골라 집중해보자."],"h":"현재 특별전, 황실 객실, 알베르티나 테라스.\n**권장 체류:** 1.5~3시간.","t":""},"A08":{"p":["책을 별로 좋아하지 않는 사람도 이곳에서는 한참 동안 천장을 올려다보게 된다. 프룽크잘은 세계에서 손꼽히는 아름다운 바로크 도서관 공간이다. 길게 이어진 나무 책장, 중앙의 거대한 돔과 천장화, 오래된 지구본과 조각상이 마치 영화 세트처럼 펼쳐진다. 그러나 모든 것이 실제로 황실의 지식과 권위를 보여주기 위해 만들어진 공간이다.","18세기 카를 6세의 명으로 지어진 이 도서관에는 20만 권이 넘는 역사적 책이 보관되어 있다. 중앙 천장화에는 황제의 권위를 찬양하는 상징들이 담겨 있다. 지금의 도서관이 조용히 책을 읽는 공간이라면, 프룽크잘은 책을 통해 국가의 힘과 문화를 과시하는 기념비적 공간이었다고 볼 수 있다. 실제 고서는 보존이 중요하므로 자유롭게 꺼내 읽을 수 없다.","중앙 돔 아래서 건물 전체를 바라본 다음, 양옆 책장의 색감과 장식들을 천천히 살펴보자. 짧은 시간에도 강한 인상을 남기는 장소라 호프부르크 왕궁 및 알베르티나와 묶기 좋다."],"h":"중앙 돔 천장화, 오래된 책장, 역사적 지구본.\n**권장 체류:** 30~60분.","t":""},"A09":{"p":["비엔나의 여러 성당 중 사진이 가장 아름답게 나오는 곳을 꼽으라면 카를 성당을 빼놓기 어렵다. 연못 같은 수면에 초록색 돔과 두 개의 거대한 원주가 비치는 모습은 특히 인상적이다. 이 성당은 단순히 보기 좋게 세워진 건물이 아니다. 18세기 초 비엔나를 덮친 전염병 이후 황제 카를 6세가 성 카를 보로메오에게 바친 서원에서 건립이 시작되었다.","건축가 요한 베른하르트 피셔 폰 에를라흐가 설계한 외관에는 로마의 기념 원주와 고전 건축을 떠올리게 하는 요소가 어우러져 있다. 내부에서는 화려한 바로크 장식과 돔의 프레스코화를 살펴볼 수 있다. 성당 내부의 관람 시설과 접근 가능한 구역은 시기에 따라 달라질 수 있으므로 공식 안내를 확인하자.","카를 성당은 낮과 해질 무렵의 분위기가 다르다. 광장에 앉아 수면에 비친 성당을 바라보는 것만으로도 좋고, 근처 카를스플라츠의 오토 바그너 파빌리온과 비엔나 박물관으로 이어가는 산책도 추천한다. 종교 공간이므로 내부에서는 조용히 관람하자."],"h":"녹색 돔, 두 원주, 수면 반영, 바로크 내부.\n**권장 체류:** 30~75분.","t":""},"A10":{"p":["시청사 앞에 도착하면 공공건물이 이토록 동화 속 궁전처럼 보일 수 있다는 사실에 놀라게 된다. 수많은 작은 첨탑과 길게 뻗은 파사드는 중세 고딕 건축을 닮았지만, 실제 건물은 19세기 링슈트라세 조성기에 지어진 신고딕 양식이다. 제국 수도가 급격하게 성장하면서 시의 행정과 시민의 자부심을 드러낼 상징이 필요했던 시대의 산물이다.","중앙 탑 꼭대기에는 갑옷을 입은 인물 형상의 라트하우스만(Rathausmann)이 서 있다. 아래에서 보면 작아 보이지만 비엔나를 상징하는 유명한 조각상이다. 시청사 앞 라트하우스플라츠는 건물만큼이나 중요하다. 계절에 따라 영화 축제, 크리스마스 마켓, 겨울 스케이트 행사 등으로 변신해 지역 주민과 여행객이 함께 모이는 공간이 된다.","행사가 없는 날에는 건물 전체를 차분히 볼 수 있고, 행사가 있는 날에는 비엔나의 일상과 축제 문화를 느낄 수 있다. 바로 건너편 부르크테아터와 폴크스가르텐까지 연결하면 링슈트라세의 역사적인 건축물을 한꺼번에 둘러보기 좋다. 내부 투어는 운영 여부를 따로 확인해야 한다."],"h":"신고딕 파사드, 중앙 탑, 시청사 광장의 계절 행사.\n**권장 체류:** 외관 20~40분, 행사 방문 시 더 길게.","t":""},"A11":{"p":["비엔나가 과거의 도시라고만 생각한다면 박물관지구를 걸어보자. 황실의 옛 마구간 시설을 바탕으로 조성된 이 거대한 문화 공간은 역사적인 외벽과 현대적인 전시관, 자유로운 야외 휴식 공간이 한데 어우러져 있다. 박물관 밖 광장에 사람들이 앉아 대화를 나누고 휴식하는 풍경이 이곳의 성격을 잘 보여준다.","레오폴트 미술관에서는 에곤 실레와 오스트리아 모더니즘을 만날 수 있고, mumok에서는 보다 실험적인 현대미술을 경험할 수 있다. 그러나 모든 시간을 실내 전시에 쓸 필요는 없다. 넓은 광장의 독특한 야외 가구에 앉아 쉬거나 주변 카페에 들르는 것만으로도 비엔나의 오늘을 느끼기 좋다.","박물관지구는 미술 애호가와 그렇지 않은 사람이 함께 여행할 때 특히 유용하다. 관심 있는 사람은 전시를 보고, 나머지는 주변 거리를 산책하거나 쉬기 좋기 때문이다. 가까운 마리아힐퍼 거리와 슈피텔베르크까지 이어지므로 오후나 저녁 일정에 넣는 것도 추천한다."],"h":"레오폴트 미술관, mumok 외관, 중앙 광장.\n**권장 체류:** 광장 산책 30~60분, 전시 포함 2~4시간.","t":""},"A12":{"p":["프라터 공원의 대관람차는 놀이기구라기보다 비엔나의 살아 있는 역사에 가깝다. 1897년 황제 프란츠 요제프의 재위 50주년을 기념해 만들어졌고, 시대의 변화와 전쟁을 견뎌 오늘날까지 비엔나의 상징으로 남아 있다. 높이는 최신 대관람차와 비교하면 엄청나지 않지만, 이곳에서 중요한 것은 기록적인 높이가 아니라 오래된 나무 느낌의 객실과 천천히 변하는 도시 풍경이다.","객실이 올라가면 붉은 지붕과 프라터 공원의 나무, 멀리 비엔나 시내가 차례로 펼쳐진다. 특히 일몰 무렵에는 낮과 밤 사이의 색이 도시 전체를 부드럽게 감싼다. 영화 속 장면처럼 오래된 유럽 도시를 내려다보는 낭만도 있다. 물론 날씨가 흐리거나 비가 오면 전망이 제한될 수 있다.","대관람차를 탄 후에는 프라터의 놀이기구 구역을 천천히 걸어보자. 활기찬 놀이공원과 넓은 녹지가 공존하는 것이 이 지역의 매력이다. 사람이 많은 시기에는 대기시간을 고려해야 한다."],"h":"역사적인 관람차 객실, 도시 전경, 프라터의 분위기.\n**권장 체류:** 관람차 탑승 및 주변 45~90분.","t":""},"A13":{"p":["반듯한 직선과 회색 건물이 당연하다고 생각했다면 훈데르트바서하우스는 그런 생각을 흔들어 놓는다. 울퉁불퉁한 창문 배치, 서로 다른 색의 외벽, 지붕과 발코니에서 자라는 나무들까지 모든 요소가 평범한 아파트와 다르다. 이 건물은 예술가 프리덴스라이히 훈데르트바서의 자연 친화적 건축 철학을 반영해 1980년대에 완성된 실제 주거용 건물이다.","훈데르트바서는 건축이 사람과 자연을 획일적인 틀에 가둬서는 안 된다고 생각했다. 그는 곧은 선을 경계하고, 주민이 자기 창문 주변의 모습을 표현할 자유와 도시 속 나무의 자리를 중요하게 여겼다. 건물의 색과 곡선은 단순한 장식이 아니라 획일성에 대한 그의 생각을 드러낸다.","중요한 점은 지금도 사람이 거주하는 집이어서 내부 관람이 불가능하다는 사실이다. 외관을 조용히 감상하고 주민의 사생활을 존중해야 한다. 작품 세계를 더 알고 싶다면 도보로 가까운 쿤스트하우스 빈을 함께 방문하자. 이 두 장소를 같이 보면 그의 건축과 회화가 같은 철학에서 나온 것임을 이해하기 쉽다."],"h":"비대칭 창문, 외벽 색채, 나무가 자라는 옥상과 발코니.\n**권장 체류:** 외관 20~30분, 쿤스트하우스와 함께 1.5~2.5시간.","t":""},"A14":{"p":["궁전과 박물관이 황실 비엔나의 얼굴이라면 나슈마르크트는 먹고 이야기하고 흥정하는 비엔나의 생활을 보여주는 곳이다. 좁은 시장길을 걷다 보면 올리브와 치즈, 향신료, 과일, 빵, 이국적인 식재료가 가게마다 다른 색과 향을 만들어낸다. 오래전부터 식품 거래가 활발했던 시장은 오늘날 전통적인 장보기 공간과 국제적인 음식 문화가 섞인 명소가 되었다.","이곳을 즐기는 가장 좋은 방법은 반드시 '무언가를 사야 한다'는 생각을 버리는 것이다. 시장 전체를 한 번 걸어보고 마음에 드는 가게로 돌아와 간식을 먹거나 식사를 해도 좋다. 토요일에는 일반 시장 옆의 벼룩시장이 특히 인기다. 옛 식기, 빈티지 장식품, 오래된 책과 잡화까지 다양한 물건을 구경하는 재미가 있다. 물건의 연대와 재질, 가격은 판매자에게 직접 확인하자.","시장 근처에는 오토 바그너의 아르누보 건축물과 제체시온도 있어 먹거리와 건축을 엮은 산책 코스로 좋다. 식당 영업과 벼룩시장 운영시간은 일반 식품 판매대와 다를 수 있다."],"h":"식재료와 간식, 토요일 벼룩시장, 주변 아르누보 건축.\n**권장 체류:** 1~2시간.","t":""},"A15":{"p":["그라벤은 비엔나 구시가지에서 가장 우아한 거리 중 하나다. 지금은 고급 상점과 카페, 세련된 쇼윈도가 늘어서 있지만, 거리의 이름은 옛 도시 방어 시설의 도랑에서 유래했다. 중세 비엔나가 오늘날의 쇼핑 거리로 변모하기까지 시간이 얼마나 길게 흘렀는지를 이름이 기억하고 있는 셈이다.","거리 한가운데 높게 솟은 금빛 장식의 페스트 기념탑은 단순한 조각상이 아니다. 17세기 후반 비엔나를 휩쓴 전염병 이후 신앙과 감사, 제국의 권위를 표현하기 위해 세워진 기념물이다. 천사와 구름, 인물들이 복잡하게 얽힌 조각을 가까이 보면 바로크 미술 특유의 극적인 표현을 발견할 수 있다.","그라벤은 천천히 걸을 때 더 아름답다. 슈테판 대성당을 보고 들어와 상점과 고풍스러운 건물을 감상하고, 페스트 기념탑에서 잠시 멈춘 뒤 콜마르크트 방향으로 걸어가 보자. 역사적인 상징과 현대적인 도시 생활이 한 거리에서 자연스럽게 겹쳐진다."],"h":"페스트 기념탑의 조각, 거리 건축물, 주변 쇼핑 거리.\n**권장 체류:** 20~40분.","t":""},"A16":{"p":["비엔나에서 가장 유명한 금빛 인물 사진을 본 적이 있다면 아마 이곳일 것이다. 시립공원의 요한 슈트라우스 2세 기념상은 바이올린을 든 작곡가가 황금빛으로 빛나는 모습이다. '아름답고 푸른 도나우'를 작곡한 왈츠의 왕을 기리는 이 조각은 비엔나가 음악을 얼마나 자랑스럽게 여기는지 보여준다.","1862년에 문을 연 시립공원은 비엔나 최초의 공공 공원으로 알려져 있다. 링슈트라세 개발과 함께 만들어진 녹지로, 구불구불한 산책로와 연못, 꽃밭, 나무가 어우러져 있다. 음악 기념상만 찍고 떠나기보다 공원 안쪽으로 조금 더 걸어보면 도심 한가운데에서 여유롭게 쉬는 비엔나 사람들의 일상도 만날 수 있다.","기념상은 사람이 몰리는 사진 명소이므로 이른 시간에 방문하면 비교적 여유롭다. 지하철 U4 Stadtpark와 가까워 구시가지 산책의 시작이나 마지막 휴식 장소로 활용하기 좋다."],"h":"금빛 슈트라우스 동상, 연못, 공원 산책로.\n**권장 체류:** 30~60분.","t":""},"B01":{"p":["시시 황후는 비엔나에서 가장 유명한 역사 인물 중 한 명이지만, 실제 삶은 아름다운 초상화만큼 낭만적이지 않았다. 바이에른 출신의 엘리자베트는 젊은 나이에 프란츠 요제프 황제와 결혼해 황후가 되었으나, 엄격한 궁정 생활과 개인적인 상실 속에서 자유를 갈망했다. 시시 박물관은 널리 알려진 '아름다운 황후'의 이미지와 역사 속 한 인간의 삶 사이의 거리를 보여준다.","전시에서는 그녀의 개인 소지품과 초상, 생활에 관한 이야기를 만날 수 있다. 인접한 황실 아파트먼트를 살펴보면 당시 왕실 가족의 생활 공간도 더 구체적으로 느껴진다. 영화를 통해 시시를 알고 왔다면 역사적 사실과 대중문화가 만든 이미지가 어떻게 다른지 비교해보는 재미도 크다."],"h":"개인 소장품, 황실 주거 공간, 시시의 삶에 관한 전시.\n**권장 체류:** 1~1.5시간.","t":""},"B02":{"p":["왕과 황제에게 보석과 왕관은 단순히 비싼 장신구가 아니었다. 누가 합법적으로 통치하고 어떤 권위를 갖는지를 상징하는 정치적 도구이기도 했다. 호프부르크의 황실 보물관에서는 이러한 유럽 왕조사의 상징물을 실제로 만날 수 있다. 신성로마제국 황제의 제관과 오스트리아 제국의 왕관을 보며, 서로 다른 시대의 제국이 어떻게 자신을 표현했는지 비교해보자.","화려한 보석과 금세공뿐 아니라 성유물과 종교적 상징물도 많다. 설명을 읽을 때는 '얼마나 값비쌀까'보다 '왜 이런 모양으로 만들었을까'라는 질문을 던져보면 훨씬 흥미롭다. 왕실 역사에 관심이 있다면 시시 박물관과 좋은 조합이 된다."],"h":"신성로마제국 제관, 오스트리아 황제관, 황실 의례 유물.\n**권장 체류:** 1~1.5시간.","t":""},"B03":{"p":["하얀 리피차너 말들이 음악에 맞춰 정확하고 우아하게 움직이는 모습은 일반적인 승마 공연과는 다르다. 스페인 승마학교는 오랜 궁정 승마 전통을 이어온 세계적인 기관이다. 특히 호프부르크의 아름다운 겨울 승마장은 그 자체가 볼거리다. 이름에 '스페인'이 들어가는 것은 이 전통의 역사적인 말 혈통과 관련이 있다.","말과 기수가 오랫동안 호흡을 맞춰 고난도의 움직임을 익히는 과정이 이곳의 핵심이다. 정식 공연과 아침 훈련 공개, 시설 투어는 체험 내용이 다르다. 아침 훈련에서 모든 고난도 동작이 나오는 것은 아니므로, 기대하는 장면에 따라 프로그램을 선택해야 한다."],"h":"리피차너 말, 바로크 겨울 승마장, 전통 훈련 기술.\n**권장 체류:** 선택한 프로그램에 따라 약 1~2시간.","t":""},"B04":{"p":["레오폴트 미술관은 화려한 황실 예술보다 1900년 전후 비엔나가 얼마나 과감하게 변하고 있었는지 보여주는 곳이다. 특히 에곤 실레의 작품이 유명하다. 길게 늘어난 몸과 긴장된 손, 솔직하고 때로 불편할 만큼 날카로운 시선은 고전적인 미의 기준과는 전혀 다른 느낌을 준다.","클림트의 시대와 실레의 작품을 연결해 보면 당시 예술가들이 인간의 감정과 불안, 욕망을 어떻게 표현하려 했는지 이해하기 쉽다. 건물 안에서 전시를 보고 나면 박물관지구 광장에 앉아 쉬어보자. 전통에서 현대까지 이어지는 비엔나의 변화를 짧은 동선에서 경험할 수 있다."],"h":"에곤 실레 컬렉션, 비엔나 1900년대 예술 관련 전시.\n**권장 체류:** 1.5~2.5시간.","t":""},"B05":{"p":["미술사박물관과 마주 서 있는 자연사박물관은 건물부터 웅장하다. 안으로 들어가면 공룡 화석, 광물, 운석, 동식물 표본을 통해 지구의 긴 역사를 여행하게 된다. 특히 약 3만 년 전의 선사시대 조각인 '빌렌도르프의 비너스'는 크기는 작지만 역사적인 의미가 큰 소장품이다.","전시관마다 분위기가 달라 아이들과 함께 오기 좋고, 어른에게도 생각보다 볼거리가 많다. 박물관 자체의 오래된 전시 장식과 천장도 눈여겨볼 만하다. 시간이 부족하면 선사시대 유물, 공룡과 광물 전시 중 관심 있는 분야를 중심으로 관람하자."],"h":"빌렌도르프의 비너스, 공룡 전시, 광물·운석 컬렉션.\n**권장 체류:** 2~3시간.","t":""},"B06":{"p":["황금빛 잎사귀로 덮인 둥근 돔과 하얀 건물. 제체시온은 비엔나에서 가장 독특한 미술관 건물 중 하나다. 1897년 클림트 등 예술가들은 기존 미술 제도의 보수성에 반발해 새로운 예술 운동을 시작했다. 건물 입구에 적힌 '시대에는 그 시대의 예술을, 예술에는 자유를'이라는 문구가 그 정신을 잘 표현한다.","지하에서 볼 수 있는 클림트의 《베토벤 프리즈》는 특히 중요하다. 베토벤 교향곡 9번에서 영감을 받은 이 긴 벽화에는 인간의 고통과 갈망, 예술을 통한 위안이 상징적으로 펼쳐진다. 위층에서는 현대미술 기획전이 열리므로 고전적인 클림트 작품과 오늘날의 실험적인 예술을 함께 경험할 수 있다."],"h":"황금 돔, 입구 문구, 클림트의 《베토벤 프리즈》.\n**권장 체류:** 45~90분.","t":""},"B07":{"p":["훈데르트바서하우스가 그의 철학을 바깥에서 보여준다면, 쿤스트하우스 빈은 그 생각을 더 깊이 이해하는 곳이다. 건물 안팎의 불규칙한 선, 색색의 타일과 식물은 자연과 함께 살아야 한다는 훈데르트바서의 메시지를 이어간다. 이곳은 예술가의 회화 작품과 환경에 대한 생각을 접할 수 있는 박물관이다.","그의 그림을 보고 나면 독특한 건축이 단순히 재미있는 디자인이 아니었다는 점을 알게 된다. 직선과 획일성을 거부하고 인간과 자연의 관계를 다시 생각하자는 주장인 셈이다. 건물에는 실제로 많은 식물이 자라고 있으며, 지속가능성의 관점에서도 흥미롭다."],"h":"훈데르트바서 상설전시, 건물의 곡선과 타일, 녹색 공간.\n**권장 체류:** 1~1.5시간.","t":""},"B08":{"p":["모차르트는 비엔나에 여러 번 거주했지만 오늘날 남아 있는 그의 비엔나 주거지 중 대표적인 장소가 바로 이곳이다. 슈테판 대성당에서 몇 걸음 떨어진 도무가세의 아파트에서 모차르트는 1784년부터 1787년까지 살았으며, 이 시기에 오페라 《피가로의 결혼》을 작곡했다.","화려한 공연장이 아니라 실제 사람이 살던 건물에서 천재 작곡가를 만나는 경험은 색다르다. 전시는 당시 비엔나의 음악 활동과 모차르트의 일상, 인간관계를 이해하도록 돕는다. 음악사에 익숙하지 않다면 오디오 설명을 활용하고, 관람 전 《피가로의 결혼》의 서곡을 한번 들어보는 것도 좋다."],"h":"모차르트의 옛 주거 공간, 비엔나 시절과 작품에 관한 전시.\n**권장 체류:** 1~1.5시간.","t":""},"B09":{"p":["음악의 도시 비엔나에서 악보를 몰라도 음악을 재미있게 배울 수 있는 곳이다. 음악의 집은 소리를 듣고, 몸으로 느끼고, 직접 참여하는 체험형 박물관이다. 소리가 어떻게 전달되는지 이해하는 전시부터 오스트리아의 유명 작곡가들을 소개하는 공간까지 구성이 다양하다.","특히 지휘자가 되어 가상 오케스트라를 이끄는 체험은 인기 있는 프로그램이다. 실제 지휘가 생각보다 어렵다는 사실도 몸으로 느낄 수 있다. 어린이와 함께 가거나 비 오는 날 실내 활동을 찾을 때 좋은 선택이다. 체험 설비는 현장 운영상태에 따라 달라질 수 있다."],"h":"지휘 체험, 소리 과학 전시, 비엔나 작곡가 공간.\n**권장 체류:** 1.5~2.5시간.","t":""},"B10":{"p":["매년 새해 전 세계에 방송되는 빈 필하모닉 신년음악회의 무대가 바로 무지크페라인의 황금홀이다. 눈부신 금빛 장식과 기둥, 풍성한 울림으로 유명하지만, 이곳이 특별한 이유는 아름다운 장식만이 아니다. 오랫동안 세계적인 오케스트라와 음악가들이 연주하며 만들어온 음악적 명성 때문이다.","공연장을 방문할 수 있다면 실제 음악을 듣는 경험이 가장 좋다. 같은 곡이라도 홀 안에서 울림이 퍼져나가는 방식은 녹음과 다르게 느껴진다. 공연을 관람하지 않는다면 안내 투어가 가능한지 확인해보자. 황금홀의 인기에 비해 투어나 공연 입장권은 시간과 좌석 제약이 있으므로 미리 예약하는 편이 좋다."],"h":"황금홀, 라이브 클래식 연주, 홀 내부 장식.\n**권장 체류:** 투어 약 1시간, 공연별 상이.","t":""},"B11":{"p":["무지크페라인이 전통적인 클래식의 상징이라면 콘체르트하우스는 폭넓은 음악을 만날 수 있는 공연장이다. 20세기 초 문을 연 이곳에서는 교향악과 실내악, 현대음악, 재즈 등 다양한 프로그램이 열린다. 역사적인 건물 속에서 새로운 음악을 계속 소개한다는 점이 매력이다.","여행 일정에 맞는 공연이 있다면 유명 연주자만 고집하지 말고 프로그램 내용과 홀의 성격을 함께 살펴보자. 때로는 작은 홀에서 가까이 듣는 음악이 더 오래 기억에 남는다. 같은 날 카를 성당이나 시립공원 산책과 연결하기도 좋다."],"h":"관심 있는 공연, 아름다운 로비, 다양한 공연홀.\n**권장 체류:** 공연별 상이.","t":""},"B12":{"p":["쇤브룬 궁전 정원 안에는 세계에서 가장 오래된 현존 동물원으로 알려진 쇤브룬 동물원이 있다. 1752년 황실의 동물 수집과 관찰을 위한 시설로 출발했지만, 오늘날은 현대적인 동물 복지와 보전, 교육을 중시하는 동물원으로 운영된다. 역사적인 중앙 파빌리온을 중심으로 동물원이 계획된 흔적도 볼 수 있다.","판다 등 인기 동물만 찾아다니기보다는 다양한 서식지 전시와 보전 활동을 함께 살펴보면 더 의미 있다. 아이들과 함께 방문한다면 궁전 내부보다 동물원이 더 즐거운 시간이 될 수도 있다. 부지가 크고 이동량이 많으므로 편한 신발을 추천한다. 동물 관찰은 날씨와 활동 시간에 따라 차이가 있다."],"h":"역사적 중앙 파빌리온, 대표 동물 전시, 보전 관련 설명.\n**권장 체류:** 2~4시간.","t":""},"B13":{"p":["쇤브룬 궁전 정원 뒤편 언덕 위에 서 있는 글로리에테는 그 자체로도 아름답지만, 아래를 내려다볼 때 진짜 매력이 드러난다. 1775년 마리아 테레지아 시대에 지어진 이 건축물은 화려한 아치와 기념비적인 형태로 황실의 위엄을 표현한다. 중앙 축을 따라 펼쳐지는 궁전, 정원, 멀리 도시 풍경은 치밀하게 계획된 바로크 조경의 효과를 보여준다.","궁전에서 언덕까지는 제법 걸어야 하지만, 천천히 오르며 뒤돌아보면 풍경이 조금씩 달라진다. 글로리에테 주변에 도착하면 사진을 찍거나 경치를 감상하며 쉬기 좋다. 내부·전망 테라스의 이용 여부는 계절과 운영상태를 확인해야 한다. 궁전 내부를 보지 않아도 정원 산책의 목적지로 충분히 가치가 있다."],"h":"궁전과 정원이 일직선으로 이어지는 전망, 아치형 건축.\n**권장 체류:** 왕복 산책 포함 45~90분.","t":""},"B14":{"p":["웅장한 궁전과 클래식 음악 외에도 비엔나는 과학과 산업 기술의 역사가 깊은 도시다. 기술박물관은 그 사실을 실감할 수 있는 장소다. 증기기관과 철도, 산업 기계, 에너지와 통신 분야의 전시를 통해 기술이 사람들의 생활을 어떻게 바꾸었는지 살펴볼 수 있다.","특히 큰 기계와 실제 크기의 전시물은 사진으로 보던 발명품을 현실의 물건으로 느끼게 해준다. 다양한 상호작용 전시도 있어 아이들과 공학에 관심 있는 여행자 모두 즐길 수 있다. 쇤브룬 궁전과 비교적 가까워 하루 일정을 조정할 때 선택하기 좋다."],"h":"역사적인 기계·철도 전시, 체험 코너.\n**권장 체류:** 2~3시간.","t":""},"B15":{"p":["비엔나의 구시가지 건물들이 멋있어도 도시 전체를 한눈에 보기는 어렵다. 도나우 전망탑은 시선을 위로 올려 비엔나의 다른 얼굴을 보여준다. 도나우 강과 주변 녹지, 현대적인 도시 구역, 멀리 역사 중심지가 하나의 풍경으로 연결된다.","맑은 날에는 전망이 특히 시원하지만 날씨와 시야 상태에 따라 느낌이 크게 달라진다. 고소공포증이 있다면 전망 공간의 구조를 미리 살펴보자. 탑 방문 전후로 인접한 도나우 공원을 산책하면 도심의 궁전 관광과는 다른 여유로운 시간을 즐길 수 있다."],"h":"도나우 강과 도시의 파노라마, 주변 도나우 공원.\n**권장 체류:** 1~1.5시간.","t":""},"B16":{"p":["칼렌베르크는 비엔나가 건물만 아름다운 도시가 아니라는 사실을 보여준다. 도시 북서쪽 언덕에서 내려다보면 도나우 강과 포도밭, 건물들이 넓게 펼쳐진다. 오래된 전쟁의 역사와도 관련된 산이지만, 오늘날 여행자에게 가장 큰 매력은 도시에서 조금 벗어나 만나는 자연과 전망이다.","날씨가 좋은 날에는 전망대에 머무르며 넓은 도시 풍경을 감상하고, 주변 산책로나 포도밭 지역을 함께 둘러봐도 좋다. 그린칭의 호이리게 문화와 연결하면 비엔나의 와인 전통까지 맛볼 수 있다. 구시가지에서 거리가 있고 지대가 높으므로 이동시간과 날씨를 고려해 계획하자."],"h":"도시와 도나우 강 전망, 산책로, 주변 포도밭 풍경.\n**권장 체류:** 이동시간 제외 1~2시간.","t":""},"B17":{"p":["링슈트라세의 국회의사당은 고대 그리스 신전처럼 보이는 독특한 외관으로 눈길을 끈다. 19세기 건축가 테오필 한센은 고전 그리스 건축을 민주주의와 의회 정치의 상징으로 활용했다. 건물 앞 아테나 분수는 지혜와 국가 운영을 연결하는 상징적인 장면이다.","이 건물은 단지 과거의 유적이 아니다. 지금도 오스트리아 의회 민주주의의 중심 공간이며, 일반 시민과 방문객을 위한 전시 및 방문 프로그램도 마련되어 있다. 내부 방문에는 신분 확인이나 사전 예약 등 절차가 있을 수 있으므로 공식 사이트를 확인하자. 외관만 보더라도 바로 옆 시청사·폴크스가르텐과 묶어 건축과 정치의 역사를 비교하기 좋다."],"h":"아테나 분수, 그리스식 기둥, 의회 방문 프로그램.\n**권장 체류:** 외관 20~30분, 내부 투어는 프로그램별 상이.","t":""},"B18":{"p":["공동묘지가 왜 관광지일까? 비엔나 중앙묘지에 가면 그 이유를 조금 이해할 수 있다. 넓은 나무길 사이에 역사적인 묘비와 기념물이 이어지고, 베토벤·슈베르트·브람스·요한 슈트라우스 등 음악사에 큰 발자취를 남긴 인물들의 무덤도 만날 수 있다. 이 도시가 음악가를 얼마나 소중히 기억하는지 보여주는 장소다.","중앙의 아름다운 아르누보 양식 묘지 교회도 빼놓을 수 없다. 조용한 산책로와 자연환경이 어우러져 소란스러운 관광지와는 전혀 다른 분위기다. 모차르트의 실제 무덤은 이곳이 아니며, 중앙묘지에는 그를 기리는 명예 기념물이 있다는 점도 알아두자. 넓은 구역을 걸어야 하므로 관심 있는 구역을 미리 정해두는 것이 좋다."],"h":"음악가 묘역, 중앙 묘지 교회, 역사적인 묘비.\n**권장 체류:** 1~2시간.","t":""},"C01":{"p":["그라벤 거리에서 작은 골목으로 들어서면 예상하지 못한 장엄한 바로크 교회가 나타난다. 규모는 슈테판 대성당보다 작지만, 타원형 돔과 황금빛 장식으로 꾸며진 내부는 훨씬 화려하게 느껴질 수 있다. 중세부터 종교적 의미가 있었던 자리 위에 현재의 바로크 교회가 세워졌다.","번화한 쇼핑 거리 바로 옆에서 갑자기 조용한 공간을 만나는 대비가 이곳의 매력이다. 내부 장식과 돔 프레스코화를 둘러보고 잠시 앉아 쉬어보자. 미사와 종교행사를 존중해 관람시간을 확인해야 한다."],"h":"타원형 돔, 천장화, 화려한 바로크 제단.\n**권장 체류:** 15~30분.","t":""},"C02":{"p":["유덴플라츠는 아름다운 구시가지 광장이면서 비엔나의 아픈 기억을 간직한 장소다. 중세 비엔나 유대인 공동체의 중심지였으며, 오늘날에는 홀로코스트 희생자를 기리는 레이철 화이트리드의 기념물이 서 있다. 외벽처럼 보이는 형태가 사실 바깥을 향한 책등 없는 책장 이미지를 담고 있다는 점을 알고 보면 조용한 기념물이 훨씬 깊게 다가온다.","광장 주변에는 중세 시나고그 유적을 전시하는 박물관도 있다. 이곳은 단순한 사진 명소가 아니라 희생자를 추모하고 비엔나의 복잡한 역사를 성찰하는 공간이다. 잠시 속도를 늦춰 기념물과 안내문을 살펴보는 시간을 추천한다."],"h":"홀로코스트 기념물, 중세 유대인 공동체 유적 박물관.\n**권장 체류:** 광장 20~30분, 박물관 포함 1시간 이상.","t":""},"C03":{"p":["호어 마르크트의 건물 사이를 연결하는 특별한 시계. 앙커 시계는 1911~1914년 프란츠 마치가 만든 아르누보 양식의 기계식 시계다. 12시간 동안 비엔나 역사 속 인물들이 차례로 모습을 드러내며, 정오에는 모든 인물이 음악과 함께 지나가는 장면을 볼 수 있다.","그냥 지나가면 예쁜 장식 정도로 보이지만, 정오 공연을 알고 맞춰 오면 작은 거리극을 보는 느낌이다. 다른 명소에 비해 관람 자체는 짧으니 슈테판 대성당이나 유덴플라츠 주변 산책과 연결하면 좋다."],"h":"정오의 인물 행렬, 아르누보 장식.\n**권장 체류:** 10~20분.","t":""},"C04":{"p":["호프부르크 왕궁의 웅장한 미하엘러 문 앞에는 놀랍게도 로마 시대의 유적이 함께 보인다. 미하엘러 광장은 비엔나의 서로 다른 시대가 한눈에 겹치는 장소다. 고대 로마의 흔적, 황실 왕궁의 화려한 정면, 주변의 20세기 초 근대 건축이 작은 광장을 둘러싸고 있다.","특히 아돌프 로스가 설계한 로스하우스의 절제된 외관은 장식이 많은 왕궁과 선명하게 대비된다. 유적과 건물들을 하나씩 비교해 보면 비엔나가 단일한 역사도시가 아니라 끊임없이 변화해 온 도시라는 사실을 느낄 수 있다."],"h":"왕궁 미하엘러 문, 로마 유적, 로스하우스.\n**권장 체류:** 15~30분.","t":""},"C05":{"p":["비엔나 중심부에 있으면서도 비교적 조용하게 고딕 건축을 감상하기 좋은 교회다. 높은 벽과 뾰족한 아치가 중세의 분위기를 간직하고 있으며, 특히 레오나르도 다빈치의 《최후의 만찬》을 모자이크로 재현한 대형 작품이 유명하다. 원본은 밀라노에 있지만, 이곳의 모자이크도 독특한 볼거리가 된다.","인근의 화려한 황실 건축물과 달리 차분한 분위기여서 잠시 쉬어가기 좋다. 종교 행사가 있거나 시설이 제한 운영될 때는 출입에 유의하자."],"h":"고딕 내부, 《최후의 만찬》 모자이크.\n**권장 체류:** 15~30분.","t":""},"C06":{"p":["서로 거울처럼 마주 보는 두 개의 거대한 건물 사이에 마리아 테레지아 여제의 동상이 서 있다. 한쪽은 미술사박물관, 다른 한쪽은 자연사박물관이다. 19세기 제국 비엔나가 얼마나 장대한 도시 공간을 계획했는지 잘 보여주는 광장이다.","동상에는 여제와 함께 제국의 정치·군사·문화에 기여한 인물들이 표현되어 있다. 여제의 통치가 단지 한 사람의 역사가 아니라 거대한 제국 운영의 이야기였다는 점을 생각하며 보면 흥미롭다. 박물관 입장 전후로 건물의 대칭적인 외관을 감상하기 좋은 곳이다."],"h":"마리아 테레지아 동상, 두 박물관의 대칭 건축.\n**권장 체류:** 15~30분.","t":""},"C07":{"p":["황실 건축물 사이에서 향기로운 장미 정원을 발견하는 순간, 비엔나가 공원을 얼마나 소중하게 여기는지 느끼게 된다. 폴크스가르텐은 19세기 초 시민에게 개방된 역사적인 정원으로, 장미가 피는 계절에 특히 아름답다. 수많은 장미 품종과 하얀 테세우스 신전이 조화를 이룬다.","정원에는 시시 황후를 기리는 기념물도 있다. 성대한 왕궁과 달리 사람의 속도에 맞춰 걷기 좋은 공간이다. 장미가 없을 때에도 시청사·국회의사당·왕궁을 연결하는 산책로로 추천한다."],"h":"장미 정원, 테세우스 신전, 시시 기념물.\n**권장 체류:** 20~40분.","t":""},"C08":{"p":["부르크가르텐은 원래 황제를 위한 사적인 정원이었다가 오늘날 시민의 휴식 공간이 된 곳이다. 왕궁과 알베르티나 사이의 잔디밭에는 책을 읽거나 피크닉을 즐기는 사람들이 모인다. 모차르트 기념상과 주변 역사 건물은 이곳이 평범한 동네공원이 아니라는 사실을 알려준다.","아름다운 유리 온실 건물인 팔멘하우스와 나비의 집도 눈길을 끈다. 여행 일정 중 바쁘게 걸어다니다가 잠시 여유를 찾고 싶을 때 들르기 좋다. 겨울에는 문 닫는 시간이 이른 편이므로 산책 전 확인하자."],"h":"모차르트 동상, 팔멘하우스, 잔디밭과 산책로.\n**권장 체류:** 20~45분.","t":""},"C09":{"p":["슈피텔베르크는 거대한 명소보다 골목의 분위기를 좋아하는 여행자에게 잘 어울린다. 낮은 역사적인 건물과 작은 레스토랑, 공방과 부티크가 이어져 비엔나 구시가지의 웅장함과 다른 친밀한 느낌을 준다. 한때 소박한 주거지였던 지역이 오늘날 매력적인 문화·외식 거리로 사랑받고 있다.","특히 저녁의 따뜻한 가게 불빛과 겨울철 크리스마스 마켓이 유명하다. 박물관지구를 둘러본 뒤 구경하거나 식사 장소를 찾으며 걷기 좋다. 특별한 목표 없이 천천히 골목을 걷는 것 자체가 가장 좋은 즐길 거리다."],"h":"좁은 골목, 작은 상점과 카페, 계절 시장.\n**권장 체류:** 30~60분, 식사 포함 더 길게.","t":""},"C10":{"p":["카를스플라츠의 작은 녹색·흰색 파빌리온은 단순한 옛 지하철 입구가 아니다. 비엔나 근대 건축을 대표하는 오토 바그너가 도시 철도 시스템을 위해 설계한 아르누보 건축이다. 금빛 장식과 섬세한 식물 무늬에는 교통시설도 아름다운 도시 디자인의 일부가 될 수 있다는 생각이 담겨 있다.","새로운 교통망을 계획하던 1900년 전후 비엔나의 자신감이 작은 건물에 응축되어 있다. 인근 카를 성당과 현대적인 지하철역을 비교해보면 도시 디자인의 변화가 더 잘 보인다. 내부 전시 공간의 운영은 계절에 따라 제한될 수 있다."],"h":"흰색·녹색 외관, 금빛 아르누보 장식.\n**권장 체류:** 외관 10~20분.","t":""},"C11":{"p":["나슈마르크트가 유명 관광시장이라면 카르멜리터마르크트는 조금 더 동네의 생활에 가까운 시장이다. 비엔나 2구 레오폴트슈타트의 카르멜리터 지구에는 과일과 채소, 꽃을 파는 가판대와 작은 음식점, 카페가 모여 있다. 관광지에서 한 걸음 벗어나 지역 사람들이 어떻게 장을 보고 시간을 보내는지 느끼기 좋다.","시장 주위에는 개성 있는 음식점과 조용한 주거 골목이 있다. 주변을 걷다가 아우가르텐까지 이어가면 시장과 공원을 함께 즐기는 여유로운 일정이 된다. 일부 점포는 요일과 시간별 영업 차이가 크다."],"h":"시장 가판대, 동네 카페와 음식점, 주변 골목.\n**권장 체류:** 30~60분.","t":""},"C12":{"p":["도나우 운하는 비엔나의 정돈된 궁전과 다른, 조금 더 자유롭고 현대적인 얼굴을 보여준다. 물가를 따라 그래피티와 벽화, 바와 카페, 자전거와 산책을 즐기는 사람들이 이어진다. 여름철에는 강변의 야외 공간이 특히 활기차지만, 계절과 날씨에 따라 분위기는 크게 달라진다.","짧은 산책이라도 물가 가까이 내려가 보는 것이 좋다. 위쪽 도로에서 바라본 풍경과 산책로의 시선은 꽤 다르다. 슈베덴플라츠나 우라니아 주변에서 접근해 도시의 새로운 분위기를 경험해보자."],"h":"그래피티, 수변 산책로, 도심 강변 풍경.\n**권장 체류:** 30~90분.","t":""},"C13":{"p":["아우가르텐은 정교한 나무길과 넓은 잔디밭이 있는 비엔나의 오래된 바로크 정원이다. 18세기에 시민에게 개방된 뒤 오늘날까지 동네 사람들의 산책과 운동, 피크닉 장소로 사랑받고 있다. 이곳에서는 왕궁과 박물관에서 느끼기 어려운 비엔나의 편안한 일상을 만날 수 있다.","공원 안에는 제2차 세계대전 당시 지어진 거대한 방공탑이 남아 있어 아름다운 정원과 전쟁의 흔적이 강렬하게 대비된다. 또한 아우가르텐 도자기 공방과 비엔나 소년합창단 관련 문화시설도 주변에 자리한다. 넓은 공원을 급히 통과하기보다 천천히 걸어보자."],"h":"바로크 산책로, 방공탑 외관, 초록 잔디밭.\n**권장 체류:** 45~90분.","t":""},"C14":{"p":["비엔나에서 강변으로 떠나는 작은 휴가를 원한다면 도나우섬이 좋은 선택이다. 도나우 강과 신도나우 사이에 길게 뻗은 이 섬은 원래 홍수 관리 시설의 일부로 조성되었지만, 지금은 걷기와 달리기, 자전거, 수영과 휴식을 즐기는 거대한 도시 레저 공간이다.","화려한 궁전은 없지만 물과 나무, 하늘이 넓게 펼쳐져 비엔나의 색다른 매력을 보여준다. 특히 여름에는 물가에서 시간을 보내기 좋고, 자전거를 빌려 길게 달리는 여행자도 많다. 물놀이를 계획할 때는 지정 구역과 현지 안전 안내를 확인해야 한다. 여유가 있다면 도심 관광 하루 사이에 자연을 즐기는 반나절을 만들어보자."],"h":"강변 풍경, 자전거·산책로, 여름철 수변 활동.\n**권장 체류:** 1~3시간 이상.","t":""}};

/* Phase 23: a failed remote image must never hide the place or its attribution. */
function photoFail23(img){
 if(!img || img.dataset.failed23==='yes')return;
 const primary=img.getAttribute('data-legacy-photo');
 if(primary && img.dataset.retry23!=='yes'){
   img.dataset.retry23='yes';
   img.src=primary;
   return;
 }
 img.dataset.failed23='yes';img.style.visibility='hidden';
 const target=img.parentElement;if(!target)return;
 target.classList.add('photo-failed23');
 if(getComputedStyle(target).position==='static')target.style.position='relative';
 const fallback=document.createElement('div');
 fallback.className='photo-error23';fallback.setAttribute('role','status');
 const label=(img.getAttribute('alt')||'이 장소').replace(/ 사진$| 큰 사진$| 여행 사진$/,'');
 fallback.textContent=label+' · 사진 연결 확인 필요';
 target.insertBefore(fallback,img.nextSibling);
}

let vn46Auto=null;
function vn46StopAuto(){
 if(vn46Auto){cancelAnimationFrame(vn46Auto.raf);vn46Auto=null;}
 const full=document.querySelector('.vn44-full');
 if(full){full.classList.add('vn44-paused');const b=full.querySelector('.vn44-pause');if(b){b.textContent='▶';b.setAttribute('aria-label','자동 스크롤 다시 시작');}}
}
function vn46StartAuto(){
 const full=document.querySelector('.vn44-full'),scroller=full?.querySelector('.vn44-story'),track=full?.querySelector('.vn44-track');
 if(!scroller||!track)return;
 if(vn46Auto)cancelAnimationFrame(vn46Auto.raf);
 const maxScroll=Math.max(0,scroller.scrollHeight-scroller.clientHeight);
 if(maxScroll<2)return;
 full.classList.remove('vn44-paused');
 const button=full.querySelector('.vn44-pause');if(button){button.textContent='Ⅱ';button.setAttribute('aria-label','자동 스크롤 일시정지');}
 // Keep motion visible and consistent while allowing user gestures to take over immediately.
 const duration=Number(track.dataset.duration)||70;
 const speed=Math.max(.024,Math.min(.048,maxScroll/(duration*1000)));
 let last=0,position=scroller.scrollTop;
 const state={raf:0};
 function tick(t){
  if(vn46Auto!==state||!scroller.isConnected)return;
  if(last){
   position=Math.min(maxScroll,position+Math.min(t-last,80)*speed);
   scroller.scrollTop=position;
  }
  last=t;
  if(position>=maxScroll-.5){vn46StopAuto();return;}
  state.raf=requestAnimationFrame(tick);
 }
 vn46Auto=state;
 state.raf=requestAnimationFrame(tick);
}
function vn46Init(){
 const scroller=document.querySelector('.vn44-story'),track=scroller?.querySelector('.vn44-track');
 if(!scroller||!track)return;
 // Leave approximately two lines visible before the automatic upward movement.
 track.style.paddingTop=Math.max(0,scroller.clientHeight-76)+'px';
 track.style.paddingBottom=Math.round(scroller.clientHeight*.75)+'px';
 scroller.scrollTop=0;
 const interrupt=()=>vn46StopAuto();
 scroller.addEventListener('touchstart',interrupt,{passive:true});
 scroller.addEventListener('pointerdown',interrupt,{passive:true});
 scroller.addEventListener('wheel',interrupt,{passive:true});
 // Desktop Chrome: enable grab-and-drag and a decaying fling, while retaining
 // the browser's native touch scrolling/momentum on phones and tablets.
 let mouseDrag=null,flingFrame=0;
 const stopFling=()=>{if(flingFrame){cancelAnimationFrame(flingFrame);flingFrame=0;}};
 scroller.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse'||e.button!==0)return;
  interrupt();stopFling();
  mouseDrag={id:e.pointerId,y:e.clientY,last:performance.now(),velocity:0,moved:false};
  scroller.setPointerCapture(e.pointerId);
  scroller.classList.add('vn46-dragging');
 });
 scroller.addEventListener('pointermove',e=>{
  if(!mouseDrag||e.pointerId!==mouseDrag.id)return;
  const now=performance.now(),dy=e.clientY-mouseDrag.y,dt=Math.max(1,now-mouseDrag.last);
  if(Math.abs(dy)>1)mouseDrag.moved=true;
  scroller.scrollTop-=dy;
  const v=-dy/dt;
  mouseDrag.velocity=mouseDrag.velocity*.45+v*.55;
  mouseDrag.y=e.clientY;mouseDrag.last=now;
 });
 function releaseDrag(e){
  if(!mouseDrag||e.pointerId!==mouseDrag.id)return;
  const v=mouseDrag.velocity;
  mouseDrag=null;scroller.classList.remove('vn46-dragging');
  if(scroller.hasPointerCapture(e.pointerId))scroller.releasePointerCapture(e.pointerId);
  if(Math.abs(v)<.12)return;
  let velocity=v,last=performance.now();
  const fling=t=>{
   if(!scroller.isConnected)return;
   const dt=Math.min(35,t-last);last=t;
   const old=scroller.scrollTop;
   scroller.scrollTop+=velocity*dt;
   velocity*=Math.exp(-dt/290);
   if(Math.abs(velocity)>.035&&Math.abs(scroller.scrollTop-old)>.05)flingFrame=requestAnimationFrame(fling);
   else flingFrame=0;
  };
  flingFrame=requestAnimationFrame(fling);
 }
 scroller.addEventListener('pointerup',releaseDrag);
 scroller.addEventListener('pointercancel',releaseDrag);
 scroller.addEventListener('wheel',stopFling,{passive:true});
 scroller.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].includes(e.key))interrupt();});
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){vn46StopAuto();return;}
 vn46StartAuto();
}

/** Phase 18 — local-only preview of remaining visits; never moves booked events.
 * Values are display estimates unless a validated route/hours provider is supplied.
 */
function toMinutes(s){if(typeof s!=='string'||!/^([01]\d|2[0-3]):[0-5]\d$/.test(s))return NaN;const [h,m]=s.split(':').map(Number);return h*60+m;}
function toClock(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;}
function previewRemaining({timeline,now,dayStart='09:30',dayEnd='18:00',visited=[],skipped=[],eventDone=[],opening=()=>({open:0,close:1440,closed:false}),transferBuffer=15,restBuffer=10}={}){
 const errors=[],warnings=[];
 if(!Array.isArray(timeline))return {errors:['일정 목록이 없습니다.'],warnings:[],entries:[],unplaced:[],unchangedEvents:[]};
 const current=toMinutes(now),start=toMinutes(dayStart),end=toMinutes(dayEnd);
 if(!Number.isFinite(current)||!Number.isFinite(start)||!Number.isFinite(end)||end<=start)return {errors:['시간 값 또는 관광 가능 시간이 잘못되었습니다.'],warnings:[],entries:[],unplaced:[],unchangedEvents:[]};
 const visitedSet=new Set(visited),skippedSet=new Set(skipped),eventDoneSet=new Set(eventDone);
 const events=timeline.filter(e=>e.type==='event').map(e=>({...e})).sort((a,b)=>toMinutes(a.start)-toMinutes(b.start));
 const places=timeline.filter(e=>e.type!=='event'&&!visitedSet.has(e.id)&&!skippedSet.has(e.id));
 const unchangedEvents=events.map(e=>({...e}));
 let cursor=Math.max(current,start),segment=0,prev=null;
 const slots=[];
 for(const e of events){
  const a=toMinutes(e.start),b=toMinutes(e.end),before=Number(e.bufferBefore??30),after=Number(e.bufferAfter??15);
  if(!Number.isFinite(a)||!Number.isFinite(b)||b<=a||before<0||after<0){errors.push(`${e.title||'예약'}: 예약 시간이 올바르지 않습니다.`);continue;}
  if(a<current&&!eventDoneSet.has(e.id))warnings.push(`${e.title}: 예약 시작 시간이 이미 지났습니다. 직접 참석 상태를 확인하세요.`);
  const blockA=a-before,blockB=b+after;
  if(blockA>cursor&&cursor<end)slots.push({start:cursor,end:Math.min(end,blockA),nextEvent:e});
  cursor=Math.max(cursor,blockB);prev=e;segment++;
 }
 if(cursor<end)slots.push({start:cursor,end, nextEvent:null});
 const scheduled=[],unplaced=[];
 let minIndex=0;
 for(const p of places){
  const duration=Number.isFinite(p.duration)?Math.max(10,Math.min(480,Math.round(p.duration))):60;
  const hours=opening(p)||{open:0,close:1440};
  if(hours.closed){unplaced.push({id:p.id,reason:'선택한 날짜에 휴관 또는 관람 불가'});continue;}
  let placed=false;
  for(let i=minIndex;i<slots.length;i++){
   const slot=slots[i];
   const previous=scheduled.length&&scheduled[scheduled.length-1]._slot===i?scheduled[scheduled.length-1]:null;
   const minStart=Math.max(slot.start,Number(hours.open??0),previous?toMinutes(previous.end)+restBuffer:slot.start);
   const travel=Number.isFinite(p.transfer)?Math.max(8,Math.min(120,p.transfer)):transferBuffer;
   const candidateStart=minStart+(previous?travel:transferBuffer);
   const candidateEnd=candidateStart+duration;
   const deadline=Math.min(slot.end,Number(hours.close??1440))-(slot.nextEvent?transferBuffer:0);
   if(candidateEnd<=deadline){
    scheduled.push({...p,start:toClock(candidateStart),end:toClock(candidateEnd),transfer:travel,routeMethod:'live-preview-estimate',_slot:i});
    slots[i].start=candidateEnd+restBuffer;minIndex=i;placed=true;break;
   }
  }
  if(!placed)unplaced.push({id:p.id,reason:'남은 관광시간·예약 도착 여유·운영시간 안에 배치할 수 없음'});
 }
 const entries=[...scheduled.map(({_slot,...rest})=>rest),...unchangedEvents].sort((a,b)=>toMinutes(a.start)-toMinutes(b.start)||(a.type==='event'?-1:1));
 if(unplaced.length)warnings.push(`${unplaced.length}곳은 오늘 남은 일정에 배치하지 못했습니다. 삭제되거나 방문 완료 처리되지는 않습니다.`);
 warnings.push('이동·관람시간은 추정치입니다. 현지 교통과 운영시간은 별도로 확인하세요.');
 return {errors,warnings,entries,unplaced,unchangedEvents,planned:scheduled.length,remaining:places.length,now,dayStart,dayEnd};
}

function activeTimeline(d){const date=tripDates(state.date,state.days)[d];return state.liveOverrides?.[date]||state.itinerary?.timelines?.[d]||[];}
function livePreviewPage(){if(!state.live||!state.itinerary)return '';const di=state.currentDay||0;const pv=state.livePreview;const base=activeTimeline(di);const count=base.filter(x=>x.type==='place'&&!state.done[x.id]&&!state.skipped[x.id]).length;return `<div class="card live-replan"><div class="row between"><div class="h2">⏱ 현지 일정 조정</div><span class="pill">남은 ${count}곳</span></div><p class="sub">현재 시각을 직접 선택하면 방문한 곳과 예약을 그대로 유지한 채 <b>오늘 남은 일정만</b> 다시 배치합니다.</p><label class="field"><span class="label">기준 시각 · 비엔나 현지시간</span><input id="live-clock" type="time" class="select" value="${h(state.liveClock)}"></label><div class="two">${btn('지금부터 다시 계산','live-preview','navy block')}${btn('원래 일정 복원','live-restore','outline block')}</div>${pv?`<div class="live-preview"><b>변경 미리보기</b><p class="tiny">예약은 이동하지 않습니다. 날짜별 관광 종료 시각은 유지합니다.</p>${pv.entries.map(e=>`<div class="live-preview-row ${e.type==='event'?'locked':''}"><span>${h(e.start)}–${h(e.end)}</span><strong>${e.type==='event'?'🔒 '+h(e.title):h(byId(e.id)?.ko||e.id)}</strong></div>`).join('')}${pv.unplaced.length?`<div class="warning">오늘 배치하지 못한 장소: ${pv.unplaced.map(x=>h(byId(x.id)?.ko||x.id)).join(', ')}. 이 명소들은 미방문으로 남습니다.</div>`:''}${pv.warnings.length?`<p class="tiny">${h(pv.warnings.join(' / '))}</p>`:''}${pv.errors.length?`<div class="warning">${pv.errors.map(h).join(' / ')}</div>`:btn('✓ 이 일정으로 적용','live-apply','primary block')}<button class="btn outline block" data-act="live-cancel">미리보기 취소</button></div>`:''}<p class="tiny">현재/실제 시간은 자동 조회하지 않습니다. 선택한 시각 기준으로만 재계산합니다. 운영시간·경로는 일부 근사값입니다.</p></div>`;}

function editorialInfo(c){

 return `<section class="editorial-feature" aria-label="관광지 소개">

function vn44Guide(id,short=false){
 const d=LONG_GUIDES48[id];if(!d)return '';
 const p=d.p.map(x=>'<p>'+h(x)+'</p>').join('');
 if(short)return p;
 // Original records put "**권장 체류:** ..." in h while leaving t blank.
 // Extract this consistently for all sightseeing records, avoiding reversed/duplicated labels.
 const raw=String(d.h||'');
 const chunks=raw.split(/\n\s*\*\*권장 체류:\*\*\s*/);
 const highlights=chunks[0].trim();
 const duration=String(d.t||'').trim()||(chunks.length>1?chunks.slice(1).join(' ').trim():'');
 return '<section class="vn44-guide"><h3>이 장소의 이야기</h3>'+p+
 (highlights?'<p><b>놓치지 말 것</b> · '+h(highlights)+'</p>':'')+
 (duration?'<p><b>권장 체류시간</b> · '+h(duration)+'</p>':'')+
 '</section>';
}

const VN52_STORIES=[{"id":"VS1","name":"Deutschordenshaus / Kirche des Deutschen Ordens","title":"모차르트가 새로운 삶을 시작한 기사단의 집","address":"Singerstraße 7","story":"슈테판 대성당에서 조금만 걸으면 가늘고 조용한 Singerstraße 골목에 도착합니다. 이곳의 독일기사단 건물은 바쁜 도심 한복판에 아늑한 안뜰 두 곳을 품고 있습니다. 중세 종교기사단의 비엔나 거점이 시대에 따라 모습을 바꾸어 온 흔적을 살펴보세요. 화려한 정면보다 문 안쪽의 건축 공간이 특히 인상적입니다.\n\n이 주소는 단지 ‘기사단의 집’이 아닙니다. 중세 유럽에서 종교적 임무와 군사적 역할을 함께 수행했던 독일기사단이 도시에서 활동하던 자리를 오늘날까지 보여줍니다. 비엔나 관광청에 따르면 Singerstraße 7의 안뜰은 두 곳이며, 안쪽에는 17세기 양식의 건물 정면이 남아 있습니다. 여기에는 놀라운 음악사도 있습니다. 관광청은 모차르트와 브람스가 모두 이 건물에서 지냈다고 소개합니다. 그러니 좁은 입구를 지나며 중세 기사단의 공간이 훗날 작곡가들의 숙소이기도 했다는 두 겹의 역사를 떠올려 보세요. 가까운 보물관은 기사단의 유산을 이해하는 데 도움이 됩니다. 안뜰의 공개 여부는 방문 당일 확인해야 합니다.","excerpt":"슈테판 대성당에서 조금만 걸으면 가늘고 조용한 Singerstraße 골목에 도착합니다. 이곳의 독일기사단 건물은 바쁜 도심 한복판에 아늑한 안뜰 두 곳을 품고 있습니다. 중세 종교기사단의 비엔나 ","lat":48.2075,"lon":16.3752,"source":"https://www.wien.info/en/see-do/discover-vienna/hidden-gems/vienna-courtyards-362714","extra":"https://www.wien.info/en/see-do/discover-vienna/hidden-gems/vienna-courtyards-362714"},{"id":"VS6","name":"Stadtpalais Prinz Eugen","title":"전쟁 영웅이 외교를 펼치던 겨울 궁전","address":"Himmelpfortgasse 8","story":"Himmelpfortgasse의 이 궁전에는 합스부르크 군대의 명장 사부아 공 외젠이 살았습니다. 그는 1696년부터 건설을 추진했고, 궁전에서는 외교사절을 맞고 전쟁 관련 회의와 문서 작업까지 진행했습니다. 화려한 바로크 건물이 단순한 개인 저택이 아니라 유럽 정치의 무대이기도 했다는 점이 흥미롭습니다. 현재는 국가기관과 연결된 공간이므로 내부 출입은 별도로 확인해야 합니다.\n\n유명한 벨베데레 궁전을 세운 그 인물, 바로 오이겐 공(Prinz Eugen von Savoyen)의 도심 거처입니다. 전장에서 얻은 명성과 부는 궁전의 웅장한 계단과 접견 공간으로도 표현됐습니다. 벨베데레가 여름의 궁전이었다면, 이 도심 궁전은 정치적 손님을 만나고 업무를 보던 ‘겨울 궁전’으로 알려져 있습니다. 합스부르크 제국의 국제정치가 회의실뿐 아니라 귀족의 사적인 궁전에서도 움직였다는 점이 흥미롭습니다. 장식의 화려함이 단지 사치가 아니라 신분과 권력의 언어였다는 시선으로 건물 정면을 살펴보세요. 역사적 기능은 확인되지만 개별 방에서 열린 회의의 상세 장면은 재구성하지 않았습니다.","excerpt":"Himmelpfortgasse의 이 궁전에는 합스부르크 군대의 명장 사부아 공 외젠이 살았습니다. 그는 1696년부터 건설을 추진했고, 궁전에서는 외교사절을 맞고 전쟁 관련 회의와 문서 작업까지 진","lat":48.2053,"lon":16.3751,"source":"https://www.burghauptmannschaft.at/Liegenschaften/Liegenschaften/Wien/Innere-Stadt0/Bundesministerium-f%C3%BCr-Finanzen.html","extra":"https://www.burghauptmannschaft.at/Liegenschaften/Liegenschaften/Wien/Innere-Stadt0/Bundesministerium-f%C3%BCr-Finanzen.html"},{"id":"VS9","name":"Palais Kinsky","title":"황실 귀족들의 부가 건축이 되다","address":"Freyung 4","story":"프라이융 광장의 킨스키 궁전은 귀족이 어떤 방식으로 위신과 권력을 과시했는지 보여줍니다. 바로크 시대의 도시 궁전은 단순히 잠을 자는 집이 아니라 손님을 맞고 사회적 지위를 드러내는 공간이었습니다. 프라이융을 걷다가 궁전의 정면과 광장의 다른 건물들을 나란히 비교해 보세요. 비엔나 도심의 귀족 세계가 조금 가까워집니다.\n\n이 궁전의 이름이 ‘킨스키’라고 해서 처음부터 킨스키 가문이 지은 것은 아닙니다. 관광청은 이곳을 Palais Daun-Kinsky라고 소개합니다. 귀족 도시 비엔나에서 궁전의 이름은 건축 후 소유 가문이 달라지면서 바뀌기도 했습니다. 건물에 가까이 다가가면 광장과 정면이 함께 하나의 무대처럼 느껴집니다. 바로크 귀족은 자신의 명성을 그림이나 문서가 아닌 계단, 창문의 질서, 화려한 장식으로도 드러냈습니다. 궁전은 개인이 살던 집이면서 공식적인 손님을 맞고 가문을 알리는 장소였습니다. 프라이융의 이웃 궁전과 비교하면 서로 다른 가문이 도시의 중심에 남긴 흔적을 더 잘 볼 수 있습니다.","excerpt":"프라이융 광장의 킨스키 궁전은 귀족이 어떤 방식으로 위신과 권력을 과시했는지 보여줍니다. 바로크 시대의 도시 궁전은 단순히 잠을 자는 집이 아니라 손님을 맞고 사회적 지위를 드러내는 공간이었습니다.","lat":48.21145,"lon":16.3652,"source":"https://www.wien.info/en/palais-daun-kinsky-129968","extra":"https://www.wien.info/en/palais-daun-kinsky-129968"},{"id":"VS11","name":"Palais Lobkowitz","title":"베토벤의 영웅 교향곡이 먼저 울린 방","address":"Lobkowitzplatz 2","story":"이 궁전의 ‘에로이카 홀’에서는 베토벤이 자신의 교향곡 3번을 후원자 로브코비츠 공작에게 사적으로 들려주었습니다. 오늘날 수많은 사람이 알고 있는 음악이 한때는 소수 귀족의 방에서 처음 울려 퍼졌다는 사실을 상상해 보세요. 건물 자체는 화려한 바로크 궁전이며 공연예술 관련 박물관으로도 활용돼 왔습니다.\n\n음악이 시작되기 전, 화려한 방에는 후원자와 초대받은 소수의 귀족이 모였을 것입니다. 이것은 특정 날의 목격 기록을 재현한 장면이 아니라 당시 귀족 후원 문화의 일반적인 모습입니다. 실제로 로브코비츠 공작은 베토벤의 중요한 후원자였으며, 궁전의 ‘에로이카 홀’은 교향곡 3번과 연결되어 이름이 붙었습니다. 비엔나 관광청은 이곳에서 〈영웅〉을 비롯한 작품들이 초기 연주를 했다고 설명합니다. 오늘날 이 곡은 누구나 공연장에서 들을 수 있지만, 한때 새로운 음악은 후원자를 위한 궁정과 개인 공간에서 먼저 시험되었습니다. 이 궁전이 단순한 미술관 건물보다 흥미로운 이유입니다. 참고로 ‘이곳에서의 초기 사적 연주’와 일반 대중을 대상으로 한 공식 초연은 구별해야 합니다.","excerpt":"이 궁전의 ‘에로이카 홀’에서는 베토벤이 자신의 교향곡 3번을 후원자 로브코비츠 공작에게 사적으로 들려주었습니다. 오늘날 수많은 사람이 알고 있는 음악이 한때는 소수 귀족의 방에서 처음 울려 퍼졌다","lat":48.2044,"lon":16.3671,"source":"https://www.wien.info/en/recommendations/ludwig-van-beethoven-walk","extra":"https://www.wien.info/en/recommendations/ludwig-van-beethoven-walk"},{"id":"VS14","name":"Palais Dorotheum","title":"황제가 만든 경매장에서 예술품이 오가다","address":"Dorotheergasse 17","story":"도르오테움은 고급 골동품 가게처럼 보이지만 그 뿌리는 1707년 황제 요제프 1세가 세운 경매기관입니다. 지금도 회화, 보석, 가구와 도자기 같은 수많은 물건이 이곳을 거칩니다. 눈앞의 물건 한 점이 여러 시대의 주인을 거쳐 왔을 수 있다는 생각으로 건물을 바라보면, 비엔나의 예술과 상업 역사가 함께 보입니다.\n\n도르오테움이 시작된 1707년은 오늘날 경매장 건물의 준공연도와 다릅니다. 황제 요제프 1세가 창설한 기관은 시대가 바뀌며 예술품과 귀중품의 유통을 담당하게 되었고, 지금 보는 화려한 신바로크 건물은 1901년에 완성됐습니다. 사람들은 보석이나 그림이 경매에 나오는 이유가 무엇인지, 누가 만들었고 어떤 손을 거쳤는지 상상하게 됩니다. 실제 소유자나 가격을 특정한 물건에 대해 확인하지 않고 지어내지는 않았습니다. 그렇지만 이 공간 자체가 분명히 보여 주는 사실이 있습니다. 비엔나의 예술사는 화가와 황제의 역사만이 아니라 가치를 평가하고 사고팔던 사람들의 역사이기도 하다는 것입니다.","excerpt":"도르오테움은 고급 골동품 가게처럼 보이지만 그 뿌리는 1707년 황제 요제프 1세가 세운 경매기관입니다. 지금도 회화, 보석, 가구와 도자기 같은 수많은 물건이 이곳을 거칩니다. 눈앞의 물건 한 점","lat":48.2064,"lon":16.3684,"source":"https://www.wien.info/en/see-do/shopping/auctions-in-vienna-339826","extra":"https://www.wien.info/en/see-do/shopping/auctions-in-vienna-339826"},{"id":"VS17","name":"Basiliskenhaus","title":"우물 속 괴물을 물리친 방법은 거울이었다","address":"Schönlaterngasse 7","story":"이 작은 골목의 집에는 사람을 해치는 바실리스크가 우물에 나타났다는 전설이 전합니다. 용감한 제빵사 조수가 거울을 들고 내려가 괴물에게 제 얼굴을 보여주었다는 이야기지요. 그러나 1212년에 괴물이 있었다는 역사적 증거는 없습니다. 16세기 문헌에 기록된 전설이며, 지금 보이는 외벽 장식은 이후 시대에 만들어졌습니다. 사실과 전설을 나눠 즐겨보세요.\n\n이야기의 시작은 깊은 우물입니다. 전설 속 주민들은 이상한 기운에 겁을 먹고 우물 안에 무서운 바실리스크가 있다고 믿습니다. 바실리스크는 눈을 마주친 사람에게 해를 끼친다는 상상의 괴물입니다. 이때 젊은 제빵사 조수가 거울을 들고 내려가 괴물이 자신의 모습을 보게 했다는 이야기가 전해집니다. 어느 시대의 이야기인가에 대해서는 문헌과 후대의 전승을 구분해야 합니다. 1212년이라는 연도는 실제 괴물의 등장 기록이 아닙니다. 오히려 이 일화는 당시 사람들이 질병과 정체 모를 위험을 어떻게 설명하고 기억했는지 알려줍니다. 골목에 서서 건물 벽의 바실리스크 장식을 찾으면, 무서운 이야기의 마지막 장면을 도시 한복판에서 발견하는 기분이 듭니다.","excerpt":"이 작은 골목의 집에는 사람을 해치는 바실리스크가 우물에 나타났다는 전설이 전합니다. 용감한 제빵사 조수가 거울을 들고 내려가 괴물에게 제 얼굴을 보여주었다는 이야기지요. 그러나 1212년에 괴물이","lat":48.2091,"lon":16.377,"source":"https://www.immuseum.at/orte/basiliskenhaus-schoenlaterngasse-wien","extra":"https://www.immuseum.at/orte/basiliskenhaus-schoenlaterngasse-wien"},{"id":"VS27","name":"Österreichische Akademie der Wissenschaften","title":"베토벤 교향곡 7번이 울렸던 학문의 홀","address":"Dr.-Ignaz-Seipel-Platz 2","story":"오스트리아 과학아카데미 건물은 단순한 연구기관이 아닙니다. 역사적인 축제홀에서는 베토벤이 교향곡 7번과 ‘웰링턴의 승리’를 직접 지휘해 큰 성공을 거두었습니다. 대학과 학문의 공간이 동시에 비엔나 음악사의 무대였다는 사실이 뜻밖입니다. 옛 대학지구에서 ‘음악의 도시’가 가진 다채로운 얼굴을 발견해 보세요.\n\n1813년 비엔나는 전쟁과 정치의 소식이 이어지던 도시였습니다. 그런 시대에 베토벤의 교향곡 7번과 전쟁을 소재로 한 〈웰링턴의 승리〉가 같은 음악회에서 청중을 만났습니다. 오늘날 오스트리아 과학아카데미가 사용하는 건물의 축제홀(Festsaal)은 이 음악사의 장면과 연결되어 있습니다. 이 장소가 뜻밖인 이유는 지금의 이름 때문입니다. 우리는 학술기관을 조용한 연구 공간으로 생각하지만, 당시의 강당은 음악과 공적 모임이 어우러지는 장소이기도 했습니다. 당시 연주에 관해 베토벤의 직접 지휘가 언급되지만, 연주 순서나 참석자의 반응을 소설처럼 덧붙이지 않았습니다. 학문과 예술이 만난 장소라는 점에 주목해 보세요.","excerpt":"오스트리아 과학아카데미 건물은 단순한 연구기관이 아닙니다. 역사적인 축제홀에서는 베토벤이 교향곡 7번과 ‘웰링턴의 승리’를 직접 지휘해 큰 성공을 거두었습니다. 대학과 학문의 공간이 동시에 비엔나 ","lat":48.208,"lon":16.378,"source":"https://www.wien.info/en/recommendations/ludwig-van-beethoven-walk","extra":"https://www.wien.info/en/recommendations/ludwig-van-beethoven-walk"},{"id":"VS32","name":"Augustinerkirche","title":"황제와 시시 황후가 결혼한 교회","address":"Augustinerstraße 3","story":"1854년, 열여섯 살 엘리자베트와 프란츠 요제프 황제가 이 교회에서 혼인했습니다. 이곳은 수많은 합스부르크 가족의 결혼식이 열린 궁정 교회였습니다. 특별한 사실 하나: 황실의 장례 문화에서는 몸과 심장을 다른 곳에 안치하는 전통도 있었고, 이곳에는 ‘심장 묘역’이 남아 있습니다. 결혼과 이별, 두 왕실 의례를 한 장소에서 만나는 셈입니다.\n\n이 교회에서는 시시 황후의 결혼만 열린 것이 아닙니다. 1736년에는 마리아 테레지아와 프란츠 슈테판이, 1881년에는 루돌프 황태자와 스테파니가 이곳에서 결혼했습니다. 놀랍게도 1810년 나폴레옹과 마리 루이즈의 혼인도 이 교회의 왕실 역사에 포함됩니다. 그런가 하면 같은 교회에는 유명한 조각가 안토니오 카노바의 마리아 크리스티나 대공비 기념묘가 있으며, 로레토 예배당에는 합스부르크 가문 구성원 54명의 심장을 안치한 ‘심장 묘역’이 있습니다. 결혼과 애도라는 정반대의 의례가 한 건물 안에서 공존하는 셈입니다. 다만 심장 묘역과 카노바의 기념묘는 서로 다른 공간이므로 혼동하지 마세요. 심장 묘역은 언제나 자유롭게 관람할 수 있는 곳은 아닙니다.","excerpt":"1854년, 열여섯 살 엘리자베트와 프란츠 요제프 황제가 이 교회에서 혼인했습니다. 이곳은 수많은 합스부르크 가족의 결혼식이 열린 궁정 교회였습니다. 특별한 사실 하나: 황실의 장례 문화에서는 몸과","lat":48.2053,"lon":16.367,"source":"https://www.wien.info/en/see-do/sights-from-a-to-z/augustinian-friars-339914","extra":"https://www.wien.info/en/see-do/sights-from-a-to-z/augustinian-friars-339914"},{"id":"VS36","name":"Bäckerstraße 7","title":"평범한 출입문 뒤에 숨은 르네상스 안뜰","address":"Bäckerstraße 7","story":"Bäckerstraße 7의 진짜 볼거리는 바깥 정면보다 안쪽에 있습니다. 16세기 르네상스식 아케이드 안뜰이 남아 있고, 철제 장식에는 비더마이어 시대 화가 프리드리히 아메를링의 수집품이 활용됐다고 합니다. 도시 건축은 바깥에서만 보는 것이 아니라 안뜰로 들어가야 발견되는 역사가 있다는 것을 보여주는 곳입니다. 주거 공간이므로 조용히 둘러보세요.\n\n처음에는 그저 오래된 주택의 입구처럼 보일 수 있습니다. 그러나 안으로 이어지는 16세기 르네상스식 아케이드는 비엔나 골목의 또 다른 얼굴을 보여줍니다. 비엔나 관광청은 이 안뜰의 철제 장식이 비더마이어 시대의 화가 프리드리히 아메를링이 수집하던 물건들에서 왔다고 설명합니다. 주택이라는 평범한 용도가 수백 년간 예술적 취향과 건축 유행의 흔적을 남긴 것입니다. 링슈트라세의 거대한 기념 건축물과 달리 이곳은 관광객의 시야에서 숨겨져 있습니다. 거주 공간이므로 출입이 허용되는 범위 안에서, 소음을 내지 않고 관찰하는 것이 좋습니다.","excerpt":"Bäckerstraße 7의 진짜 볼거리는 바깥 정면보다 안쪽에 있습니다. 16세기 르네상스식 아케이드 안뜰이 남아 있고, 철제 장식에는 비더마이어 시대 화가 프리드리히 아메를링의 수집품이 활용됐다","lat":48.2086,"lon":16.3781,"source":"https://www.wien.info/en/see-do/discover-vienna/hidden-gems/vienna-courtyards-362714","extra":"https://www.wien.info/en/see-do/discover-vienna/hidden-gems/vienna-courtyards-362714"},{"id":"VS38","name":"Minoritenkirche","title":"고딕 교회에서 다빈치의 최후의 만찬을 만나다","address":"Minoritenplatz 2A","story":"미노리텐 교회는 비엔나의 중세 종교 역사를 간직한 고딕 건축물입니다. 안으로 들어서면 유명한 다빈치의 ‘최후의 만찬’을 재현한 모자이크도 볼 수 있습니다. 원본 그림은 이탈리아 밀라노에 있지만, 비엔나에서는 이 걸작이 다른 재료와 공간 속에서 어떻게 다시 태어났는지 살펴볼 수 있습니다. 중세 교회와 후대의 미술이 한 장소에 겹쳐 있습니다.\n\n레오나르도 다빈치의 〈최후의 만찬〉을 보려면 밀라노로 가야 한다고 생각하기 쉽습니다. 그런데 비엔나의 이 고딕 교회에는 크기가 매우 큰 모자이크 복제품이 있습니다. 비엔나 관광청의 상세 소개에 따르면 이 작품의 탄생에는 나폴레옹 시대 미술품 이동과 복제 계획이 얽혀 있습니다. 벽에서 떼어 갈 수 없었던 원작 대신 돌과 유리 조각으로 그림을 재현해 결국 비엔나에 오게 된 과정은 미술품이 국경을 넘던 유럽 역사의 한 장면입니다. 가까이에서 보면 그림과 달리 수많은 작은 조각으로 화면이 구성되어 있음을 알 수 있습니다. 원작이 아니라는 이유로 그냥 지나치기에는 제작사와 유럽 정치사의 맥락이 흥미로운 작품입니다.","excerpt":"미노리텐 교회는 비엔나의 중세 종교 역사를 간직한 고딕 건축물입니다. 안으로 들어서면 유명한 다빈치의 ‘최후의 만찬’을 재현한 모자이크도 볼 수 있습니다. 원본 그림은 이탈리아 밀라노에 있지만, 비","lat":48.2097,"lon":16.3638,"source":"https://www.wien.info/en/art-culture/architecture/churches-343056","extra":"https://www.wien.info/en/art-culture/architecture/churches-343056"},{"id":"VS43","name":"Kaisergruft / Kapuzinerkirche","title":"황제도 마지막에는 이곳으로 돌아왔다","address":"Neuer Markt","story":"새 시장광장 아래 카푸치너 교회의 묘역에는 합스부르크 가문의 150명이 잠들어 있습니다. 마리아 테레지아의 화려한 이중 석관 옆에서 그의 아들 요제프 2세의 간소한 석관을 비교해 보세요. 같은 황실 안에서도 죽음을 기리는 방식이 이렇게 달랐습니다. 시시 황후와 프란츠 요제프 황제의 마지막 안식처도 이곳입니다.\n\n이곳의 관람 포인트는 무덤 수보다 서로 다른 석관의 표정입니다. 마리아 테레지아와 남편 프란츠 1세의 거대한 이중 석관은 제국의 위엄을 기념합니다. 바로 그 다음 세대의 요제프 2세는 눈에 띄게 소박한 석관에 묻혔습니다. 같은 왕가에서도 죽음을 표현하는 방식과 통치자의 가치관이 달랐던 것입니다. 카푸치너 교회 아래 묘역에서는 1633년부터 합스부르크 구성원들이 안장됐고, 현재 비엔나 관광청은 150명의 안식처라고 소개합니다. 시시 황후, 프란츠 요제프 황제, 황태자 루돌프도 이곳과 이어집니다. 다만 황실의 시신이 모두 온전히 같은 장소에 놓였던 것은 아닙니다. 일부 심장은 아우구스티너 교회, 일부 내장은 별도의 장소에 안치된 전통이 있습니다.","excerpt":"새 시장광장 아래 카푸치너 교회의 묘역에는 합스부르크 가문의 150명이 잠들어 있습니다. 마리아 테레지아의 화려한 이중 석관 옆에서 그의 아들 요제프 2세의 간소한 석관을 비교해 보세요. 같은 황실","lat":48.2057,"lon":16.3707,"source":"https://www.wien.info/en/art-culture/imperial-sights/imperial-crypt-341952","extra":"https://www.wien.info/en/art-culture/imperial-sights/imperial-crypt-341952"},{"id":"VS53","name":"Heiligenkreuzerhof / Kapelle","title":"골목을 통과하면 갑자기 나타나는 조용한 수도원 안뜰","address":"Schönlaterngasse 5 / Grashofgasse 3","story":"관광객으로 붐비는 구시가지에서 Schönlaterngasse 쪽의 입구를 지나면 고요한 안뜰이 펼쳐집니다. 하일리겐크로이처호프는 도심 속 수도원 문화가 남아 있는 공간이며, 두 골목을 이어주는 통로이기도 합니다. 화려한 궁전보다 조용한 마당과 벽면의 세월을 오래 바라보기에 좋은 곳입니다. 주변의 오래된 거리와 함께 걸어보세요.\n\n여기서는 웅장한 정면보다 조용함이 주인공입니다. 두 골목 사이를 연결하는 건물 안쪽에 들어서면 도심의 소음이 잠시 멀어지는 듯합니다. 하일리겐크로이처호프는 수도원과 관계된 공간이 도심 속에 어떻게 남았는지 보여줍니다. 수도원이란 멀리 숲에 있는 건물만이 아니라, 도시와 경제·종교적 관계를 맺고 있었음을 떠올릴 수 있습니다. 관광청 자료도 Schönlaterngasse와 Grashofgasse를 연결하는 이 안뜰을 비엔나의 아름다운 숨은 공간으로 꼽습니다. 이름의 의미와 구체적인 소유 변천은 기록을 더 검토해야 하지만, 안뜰이 남아 있다는 사실 자체가 비엔나의 오래된 주거 구조를 이야기합니다. 내부는 사유·관리 공간일 수 있으므로 개방 여부를 따르세요.","excerpt":"관광객으로 붐비는 구시가지에서 Schönlaterngasse 쪽의 입구를 지나면 고요한 안뜰이 펼쳐집니다. 하일리겐크로이처호프는 도심 속 수도원 문화가 남아 있는 공간이며, 두 골목을 이어주는 통로","lat":48.20915,"lon":16.3768,"source":"https://www.wien.info/en/see-do/discover-vienna/hidden-gems/vienna-courtyards-362714","extra":"https://www.wien.info/en/see-do/discover-vienna/hidden-gems/vienna-courtyards-362714"},{"id":"VS54","name":"Hofburg","title":"700년 넘게 쌓여 온 제국의 중심","address":"Hofburg","story":"호프부르크는 한 시기에 완성된 궁전이 아닙니다. 13세기 이후 여러 세대의 황제가 자기 시대의 건물을 덧붙여 오늘의 거대한 복합단지가 되었습니다. 지금도 오스트리아 연방대통령의 공식 업무 공간이 이곳에 있습니다. 중세의 옛 부분에서 제국의 화려한 시설까지 걸어보면, 건물 자체가 비엔나 정치사의 연대표처럼 느껴집니다.\n\n호프부르크를 한눈에 보면 ‘황제가 살던 궁전 하나’처럼 보입니다. 실제로는 중세의 작은 성채에서 시작해 수백 년 동안 건물이 옆으로 붙은 복합단지입니다. 궁 안을 걸으면 시대별로 다른 외관이 나타나는데, 이것이야말로 제국의 역사를 읽는 방법입니다. 특히 오래된 슈바이처호프의 문과 뒤늦게 더해진 거대한 공간을 비교해 보세요. 비엔나 관광청은 13세기 이후 왕실이 확장한 건축 면적이 30만 제곱미터를 넘는다고 소개합니다. 한때 합스부르크 제국의 통치 중심이었던 이곳은 군주제가 사라진 뒤에도 오스트리아 연방대통령의 업무 공간으로 쓰입니다. 황제의 궁전이 공화국의 국가기관으로 이어진 변화가 건축물에 겹쳐 보입니다.","excerpt":"호프부르크는 한 시기에 완성된 궁전이 아닙니다. 13세기 이후 여러 세대의 황제가 자기 시대의 건물을 덧붙여 오늘의 거대한 복합단지가 되었습니다. 지금도 오스트리아 연방대통령의 공식 업무 공간이 이","lat":48.2066,"lon":16.3658,"source":"https://www.wien.info/en/art-culture/imperial-sights/imperial-palace-348842","extra":"https://www.wien.info/en/art-culture/imperial-sights/imperial-palace-348842"},{"id":"VS56","name":"Maria am Gestade","title":"도나우강가를 지키던 오래된 고딕 교회","address":"Salvatorgasse 12","story":"‘강가의 마리아’라는 이름처럼 마리아 암 게슈타데는 옛 도나우강 지형과 관련된 비엔나의 오랜 신앙을 떠올리게 합니다. 오늘날에는 강물보다 도심 건물들이 더 가까워 보이지만, 교회로 향하는 계단과 좁은 골목을 걸으면 도시의 높낮이와 오래된 거리 구조를 느낄 수 있습니다. 관광명소보다 중세 도시의 분위기를 찾는 분들에게 어울립니다.\n\n마리아 암 게슈타데의 이름을 직역하면 ‘강가의 마리아’에 가깝습니다. 그런데 지금 교회 주변에는 강 대신 빽빽한 건물과 좁은 골목이 보입니다. 여기서 도시의 지형을 떠올려 볼 필요가 있습니다. 비엔나의 강과 물길은 오랜 세월 위치와 모습이 바뀌었고, 도로와 제방도 달라졌습니다. 높은 곳에 자리한 교회의 계단은 이 일대가 예전부터 지형적인 경계를 이루었음을 느끼게 합니다. 이 교회는 거대한 관광지보다 시간을 거슬러 걷는 느낌을 주는 고딕 건축입니다. 첨탑과 골목의 경사를 함께 바라보면 이름이 오늘날 풍경과 왜 다르게 느껴지는지 스스로 질문하게 됩니다. 구체적인 옛 강물의 해안선을 현재 계단 바로 아래로 단정하지는 않았습니다.","excerpt":"‘강가의 마리아’라는 이름처럼 마리아 암 게슈타데는 옛 도나우강 지형과 관련된 비엔나의 오랜 신앙을 떠올리게 합니다. 오늘날에는 강물보다 도심 건물들이 더 가까워 보이지만, 교회로 향하는 계단과 좁","lat":48.21155,"lon":16.3717,"source":"https://www.wien.info/en/maria-am-gestade-film-location-920754","extra":"https://www.wien.info/en/maria-am-gestade-film-location-920754"},{"id":"VS58","name":"Ruprechtskirche","title":"비엔나에서 가장 오래된 교회 이야기","address":"Ruprechtsplatz 1","story":"루프레히트 교회는 비엔나에서 가장 오래된 교회로 소개됩니다. 공식 문헌상 확인되는 기록은 1200년 무렵이며, 더 오래되었다는 이야기는 전승의 영역입니다. 이 교회가 봉헌된 성 루프레히트는 소금 운송인과 상인의 수호성인이기도 합니다. 도시의 초기 상업과 강의 물길이 가깝게 느껴지는 작은 광장에서 비엔나의 시작을 상상해 보세요.\n\n아주 오래된 건물의 역사에는 흔히 ‘최초’라는 말이 따라붙습니다. 루프레히트 교회 역시 비엔나에서 가장 오래된 교회로 알려져 있지만, 실제로 확인되는 가장 이른 공식 문헌은 1200년경입니다. 740년에 지어졌다는 설명은 오래된 전승으로 소개해야 합니다. 교회가 봉헌된 성 루프레히트는 소금 운송과 거래를 하는 사람들의 수호성인입니다. 이 점이 흥미로운 까닭은 중세 비엔나가 강의 물길과 교역에 의지해 성장했다는 사실을 떠올리게 하기 때문입니다. 구시가지의 화려한 바로크 교회와 달리 비교적 소박한 모습에서 이 도시의 다른 시대를 만날 수 있습니다. 8세기 창건을 확정된 사실로 표현하지 않는 것이 중요합니다.","excerpt":"루프레히트 교회는 비엔나에서 가장 오래된 교회로 소개됩니다. 공식 문헌상 확인되는 기록은 1200년 무렵이며, 더 오래되었다는 이야기는 전승의 영역입니다. 이 교회가 봉헌된 성 루프레히트는 소금 운","lat":48.212,"lon":16.3753,"source":"https://www.wien.info/en/art-culture/architecture/churches-343056","extra":"https://www.wien.info/en/art-culture/architecture/churches-343056"},{"id":"VS59","name":"Jesuitenkirche","title":"눈앞의 천장이 사실은 그림이라면?","address":"Dr.-Ignaz-Seipel-Platz 1","story":"예수회 교회에 들어서면 화려한 천장과 돔이 시선을 잡아끕니다. 특히 화가 안드레아 포초는 실제로 없는 건축 구조까지 있는 것처럼 보이게 하는 원근법 그림을 그렸습니다. 한 발짝 움직여 천장을 다시 바라보면 공간의 착시가 얼마나 정교한지 알 수 있습니다. 17세기 비엔나의 종교미술은 단순히 장식이 아니라 감각을 움직이는 경험이었습니다.\n\n처음 교회에 들어가서 천장을 올려다보면 건축물 자체가 위로 계속 이어지는 듯한 착각이 듭니다. 이곳의 장식과 공간은 이탈리아 예수회 예술가 안드레아 포초의 원근법적 기법과 연결됩니다. 회화는 실제 구조물보다 가볍지만, 눈에는 깊이 있는 돔과 기둥이 펼쳐지는 것처럼 보입니다. 바로크 시대 종교미술이 단순히 그림을 걸어 두는 데서 그치지 않고 건물 안의 사람들에게 경이로운 감각을 주려 했다는 단서입니다. 교회 내부에서 관람이 허용되는 위치를 조금 옮겨 위를 다시 바라보면 눈이 어떻게 속는지 느낄 수 있습니다. 다만 모든 그림이 특정 한 사람이 직접 그린 작품이라고 단정하지 않고 구역별 작가 정보를 따로 확인해야 합니다.","excerpt":"예수회 교회에 들어서면 화려한 천장과 돔이 시선을 잡아끕니다. 특히 화가 안드레아 포초는 실제로 없는 건축 구조까지 있는 것처럼 보이게 하는 원근법 그림을 그렸습니다. 한 발짝 움직여 천장을 다시 ","lat":48.208,"lon":16.3778,"source":"https://jesuitenkirche-wien.at/kirchenraum/","extra":"https://jesuitenkirche-wien.at/kirchenraum/"},{"id":"VS71","name":"Palais Mollard-Clary","title":"도심 궁전에서 화성과 달의 지구본을 만나다","address":"Herrengasse 9","story":"몰라르트-클라리 궁전은 이제 귀족의 생활만 보여주는 곳이 아닙니다. 이곳의 지구본박물관에는 지구뿐 아니라 달과 화성, 별자리까지 표현한 다양한 지구본이 전시됩니다. 사람들이 세상을 어떻게 이해하고 지도에 담아 왔는지, 낡은 궁전 공간 속에서 과학의 역사를 만나보세요. 에스페란토 박물관도 같은 주소에 있어 독특한 문화 여행이 됩니다.\n\n궁전에서 달과 화성을 만난다고 하면 조금 이상하게 들릴 것입니다. 하지만 헤렌가세의 몰라르트 궁전에는 옛 지구본과 천구의, 달과 화성을 표현한 구체들이 모여 있습니다. 비엔나 관광청은 이곳 지구본박물관에서 약 240점의 원본 지구본을 볼 수 있다고 소개합니다. 이 전시의 재미는 오늘날 위성사진처럼 정확한 지도가 없던 시대의 사람들을 상상하는 데 있습니다. 손으로 그린 대륙과 천체의 모습은 당시 지식뿐 아니라 그들이 아직 몰랐던 것까지 보여 줍니다. 같은 건물의 에스페란토 박물관은 언어로 세계를 연결하려 했던 또 다른 인간의 시도를 소개합니다. 한 건물에서 지리학과 언어의 역사를 함께 걷는 셈입니다.","excerpt":"몰라르트-클라리 궁전은 이제 귀족의 생활만 보여주는 곳이 아닙니다. 이곳의 지구본박물관에는 지구뿐 아니라 달과 화성, 별자리까지 표현한 다양한 지구본이 전시됩니다. 사람들이 세상을 어떻게 이해하고 ","lat":48.2097,"lon":16.3655,"source":"https://www.wien.info/en/see-do/sights-from-a-to-z/globe-esperanto-museum-347104","extra":"https://www.wien.info/en/see-do/sights-from-a-to-z/globe-esperanto-museum-347104"},{"id":"VS72","name":"Peterskirche","title":"로마 병영의 자리에서 시작된 교회 전설","address":"Petersplatz","story":"페터 교회는 비엔나 구시가지의 오래된 신앙 중심지입니다. 이곳에 4세기부터 교회가 있었다는 전승이 있지만, 최초 건물에 관한 주장은 신중히 볼 필요가 있습니다. 오늘날의 아름다운 돔은 18세기 바로크 재건의 결과입니다. 오래된 기원설과 눈앞의 실제 건축을 나란히 살펴보면 한 건물에 얼마나 많은 시대가 포개질 수 있는지 알게 됩니다.\n\n성 페터 교회의 둥근 지붕을 바라보면 지금의 아름다운 바로크 건물이 처음부터 이 모습이었을 것 같습니다. 그러나 교회가 자리한 곳에 이전 시대의 예배당이 있었다는 이야기가 전해지며, 4세기 로마 병영의 예배 공간과 연결하는 주장도 있습니다. 이러한 기원설의 세부 연대는 그대로 확정해 소개할 수 없습니다. 눈앞의 건물은 18세기에 다시 지어진 바로크 교회입니다. 작은 광장을 둘러싼 상점과 방문객 사이에서, 오랫동안 같은 장소에 신앙 공간이 남고 건축 형태만 바뀌었다는 사실을 상상해 보세요. ‘기원에 관한 전설’과 ‘지금 볼 수 있는 건축’이라는 두 이야기를 함께 전하는 것이 가장 정직한 소개법입니다.","excerpt":"페터 교회는 비엔나 구시가지의 오래된 신앙 중심지입니다. 이곳에 4세기부터 교회가 있었다는 전승이 있지만, 최초 건물에 관한 주장은 신중히 볼 필요가 있습니다. 오늘날의 아름다운 돔은 18세기 바로","lat":48.20975,"lon":16.36975,"source":"https://www.erzdioezese-wien.at/unit/virc/de/sehenswuerdigkeiten/standorte/article/76644.html","extra":"https://www.erzdioezese-wien.at/unit/virc/de/sehenswuerdigkeiten/standorte/article/76644.html"},{"id":"VS78","name":"Schweizerhof (Hofburg)","title":"황궁의 오래된 문으로 시간을 거슬러 가다","address":"Hofburg Schweizerhof","story":"호프부르크의 슈바이처호프는 지금의 넓은 왕궁 가운데서도 특히 오래된 부분입니다. 붉고 검은색의 슈바이처 문을 지나면 중세 성채의 모습을 간직한 공간과 왕가의 보물을 전시하는 장소를 만나게 됩니다. 마치 화려한 제국 궁전에서 시간을 거꾸로 돌리는 듯한 경험을 해보세요.\n\n호프부르크의 거대한 규모 때문에 가장 오래된 부분을 놓치기 쉽습니다. 슈바이처호프는 중세 성채의 구조를 간직한 부분으로, 붉은색과 검은색의 슈바이처 문이 눈에 띕니다. 궁전은 한 세대가 설계한 하나의 건축물이 아니라 계속 확장된 장소라는 사실을 이 문을 지나며 실감할 수 있습니다. 주변에는 황실 보물관도 있어 왕가의 상징물을 만날 수 있습니다. 관광청은 신성로마제국의 오래된 왕관과 오스트리아 제국의 왕관이 이 단지와 연결된다고 설명합니다. 문 하나를 경계로 화려한 왕실의 이미지 뒤에 숨은 중세 비엔나의 성곽 이야기가 열리는 셈입니다.","excerpt":"호프부르크의 슈바이처호프는 지금의 넓은 왕궁 가운데서도 특히 오래된 부분입니다. 붉고 검은색의 슈바이처 문을 지나면 중세 성채의 모습을 간직한 공간과 왕가의 보물을 전시하는 장소를 만나게 됩니다. ","lat":48.2066,"lon":16.3664,"source":"https://www.wien.info/en/art-culture/imperial-sights/imperial-palace-348842","extra":"https://www.wien.info/en/art-culture/imperial-sights/imperial-palace-348842"},{"id":"VS83","name":"Stephansdom","title":"전쟁의 상처를 딛고 다시 선 비엔나의 상징","address":"Stephansplatz 3","story":"슈테판 대성당은 중세 비엔나에서 시작해 오늘까지 도시의 상징으로 남았습니다. 웅장한 고딕 탑과 알록달록한 지붕은 멀리서도 알아볼 수 있습니다. 특히 제2차 세계대전 말기의 파괴와 이후 재건은 이 건물을 단순한 종교시설이 아닌 시민들의 회복과 정체성을 상징하는 장소로 만들었습니다. 대성당 앞에서 시대를 넘어 살아남은 도시의 모습을 느껴보세요.\n\n비엔나를 대표하는 남쪽 첨탑과 화려한 지붕은 오늘날 당연한 도시 풍경처럼 보입니다. 그러나 이 건물의 역사는 파괴와 복구의 연속입니다. 비엔나 관광청은 첫 교회 건물이 12세기에 세워졌으며 현재의 고딕 모습은 14세기 이후 형성됐다고 설명합니다. 1945년의 전쟁 피해는 지붕과 내부에 큰 상처를 남겼고, 전후 재건은 시민들에게 문화유산을 함께 되살리는 사업이었습니다. 그래서 슈테판 대성당은 화려한 관광 배경일 뿐 아니라 전쟁과 복구를 기억하는 상징입니다. 탑의 모양만 보지 말고 지붕의 색과 건물의 다른 시대별 장식을 함께 비교해 보세요. 유명한 기념 건물도 세월의 변화 속에 오늘 모습을 얻었다는 점이 보입니다.","excerpt":"슈테판 대성당은 중세 비엔나에서 시작해 오늘까지 도시의 상징으로 남았습니다. 웅장한 고딕 탑과 알록달록한 지붕은 멀리서도 알아볼 수 있습니다. 특히 제2차 세계대전 말기의 파괴와 이후 재건은 이 건","lat":48.20849,"lon":16.37315,"source":"https://www.wien.info/en/see-do/sights-from-a-to-z/st-stephens-cathedral-359690","extra":"https://www.wien.info/en/see-do/sights-from-a-to-z/st-stephens-cathedral-359690"},{"id":"VS85","name":"Stadttempel / Synagoge","title":"1938년의 비극을 기억하는 살아 있는 회당","address":"Seitenstettengasse 4","story":"슈타트템펠은 1826년 문을 열었으며 비엔나 유대교 공동체의 중요한 예배 공간입니다. 1938년 11월의 폭력 속에서 도시의 다른 회당 대부분이 파괴됐지만, 이곳은 완전히 파괴되지 않고 살아남았습니다. 현재도 예배와 추모의 장소로 이어지고 있습니다. 종교시설이므로 방문 시 안내와 보안 절차를 존중해야 합니다.\n\n이곳은 다른 건물이 아니라 앞의 Seitenstettengasse 4와 같은 슈타트템펠을 가리킵니다. 앱에서는 장소 하나로 합쳐야 합니다. 건물은 1825~1826년에 설계·건축됐으며, 주거 건물에 가려진 배치 때문에 1938년 11월 폭력에서 외부 건물의 완전한 파괴를 피할 수 있었습니다. 이 사실은 비엔나의 다른 유대교 회당들이 겪은 참상을 더 선명하게 드러냅니다. 오늘날 입구와 안쪽에는 유대인 공동체의 생존과 희생을 기억하는 공간이 있습니다. 단순히 ‘숨겨진 건물이 운 좋게 남았다’고 소비하기보다, 한 공동체가 도시에서 어떤 권리를 제약받았고 어떤 박해를 겪었는지 생각해 보는 장소로 소개하는 것이 좋습니다.","excerpt":"슈타트템펠은 1826년 문을 열었으며 비엔나 유대교 공동체의 중요한 예배 공간입니다. 1938년 11월의 폭력 속에서 도시의 다른 회당 대부분이 파괴됐지만, 이곳은 완전히 파괴되지 않고 살아남았습니","lat":48.2118,"lon":16.3758,"source":"https://www.wien.info/en/see-do/sights-from-a-to-z/synagogue-360758","extra":"https://www.wien.info/en/see-do/sights-from-a-to-z/synagogue-360758"},{"id":"VS91","name":"Altes Rathaus","title":"1885년까지 비엔나를 다스렸던 옛 시청사","address":"Wipplingerstraße 8","story":"오늘날 사람들은 링슈트라세의 크고 화려한 시청사를 비엔나의 중심 행정 건물로 기억합니다. 하지만 그 이전에는 Wipplingerstraße 8의 이 건물이 시정을 담당했습니다. 비엔나시는 1316년부터 이 건물을 소유했고, 1885년에는 새 시청사로 옮기기 전 마지막 시의회 회의가 열렸습니다. 작은 골목에서 도시의 권력이 이동한 역사를 느껴보세요.\n\n비엔나 시청사를 찾는 사람들은 대개 링슈트라세의 거대한 신고딕 건물로 향합니다. 그러나 그 건물이 생기기 훨씬 전부터 비엔나의 시정은 다른 장소에서 이루어졌습니다. Wipplingerstraße 8의 옛 시청사는 비엔나시가 1316년부터 소유한 건물이었습니다. 1885년 새 시청사로 이전하기 전 마지막 시의회 회의가 이곳에서 열렸다는 사실은 특히 인상적입니다. 왕궁처럼 화려하지 않은 골목 안에서 수백 년의 행정이 이루어진 것입니다. 큰 기념 건축물 하나를 보기보다 도시가 어디에서 어떤 일을 결정했는지 생각하는 여행이라면 이 건물이 더 특별하게 느껴질 수 있습니다.","excerpt":"오늘날 사람들은 링슈트라세의 크고 화려한 시청사를 비엔나의 중심 행정 건물로 기억합니다. 하지만 그 이전에는 Wipplingerstraße 8의 이 건물이 시정을 담당했습니다. 비엔나시는 1316년","lat":48.2111,"lon":16.3693,"source":"https://www.wien.info/en/old-city-hall-129188","extra":"https://www.wien.info/en/old-city-hall-129188"},{"id":"VS92","name":"Palais Neupauer-Breuner","title":"Singerstraße의 화려한 건물 안에 숨은 안뜰","address":"Singerstraße 16","story":"Singerstraße 16의 노이파우어-브로이너 궁전은 바로크 양식의 외관뿐 아니라 안쪽 안뜰이 매력적인 건물입니다. 비엔나의 도시 궁전은 길에서 보는 화려함과 안쪽의 주거 공간이 서로 다른 분위기를 보여줍니다. 웅장한 제국 건축 대신 한적한 도심 안뜰을 보고 싶은 여행자라면 이곳을 눈여겨보세요.\n\nSingerstraße 16의 궁전은 건물 앞보다 안쪽에서 다른 얼굴을 보여 줍니다. 비엔나 관광청은 이곳을 바로크 궁전으로 소개하며, 안뜰을 둘러싼 개방형 통로(Pawlatschen)가 눈여겨볼 만하다고 설명합니다. 오래된 도심의 집들은 길을 향한 격식 있는 정면과 주민들이 실제로 오가는 안쪽 통로가 서로 다른 역할을 했습니다. 골목에서 큰 건물의 문을 지나면 잠시 도시의 밀도가 달라지는 느낌을 받을 수 있습니다. 궁전의 이름으로 특정 가문 구성원의 일상을 임의로 재현하기보다는 실제 남은 건축물의 형태를 읽는 데 집중했습니다. 개방된 시간과 출입 구역은 사전에 확인하세요.","excerpt":"Singerstraße 16의 노이파우어-브로이너 궁전은 바로크 양식의 외관뿐 아니라 안쪽 안뜰이 매력적인 건물입니다. 비엔나의 도시 궁전은 길에서 보는 화려함과 안쪽의 주거 공간이 서로 다른 분위","lat":48.20705,"lon":16.3757,"source":"https://www.wien.info/en/see-do/discover-vienna/hidden-gems/vienna-courtyards-362714","extra":"https://www.wien.info/en/see-do/discover-vienna/hidden-gems/vienna-courtyards-362714"},{"id":"VS94","name":"Pasqualatihaus","title":"베토벤이 머물며 피델리오를 쓴 집","address":"Mölker Bastei 8","story":"베토벤은 1804년부터 1815년 사이 이 집에 여러 차례 머물렀습니다. 지금은 음악사의 명작이 된 오페라 ‘피델리오’와 여러 피아노 작품을 이곳에서 작업했습니다. 음악이 처음부터 세계적인 걸작이었던 것은 아닙니다. 일상을 보내며 고민하고 고쳐 쓰던 한 사람의 작업 공간이라는 사실을 떠올려 보세요. 현재는 베토벤을 기념하는 공간으로 활용됩니다.\n\n베토벤이 비엔나에서 늘 한 집에만 살았던 것은 아닙니다. 여러 차례 이사하고 돌아오기를 반복한 생활 가운데 파스콸라티 하우스는 특히 중요한 주소였습니다. 관광청에 따르면 그는 1804년부터 1815년 사이 이 집에 여러 번 머물며 오페라 〈피델리오〉, 피아노 작품 〈엘리제를 위하여〉 등의 작업을 했습니다. 이름은 당시 집주인의 성에서 유래했습니다. 훌륭한 음악이 어느 날 갑자기 완성되는 것이 아니라 일상을 살고 악보를 고치는 과정 속에서 만들어진다는 사실을 떠올리게 합니다. 오늘날 건물 안에는 작곡가를 기리는 기념 공간과 자료가 있으며, 방문 가능 시간은 별도로 확인해야 합니다.","excerpt":"베토벤은 1804년부터 1815년 사이 이 집에 여러 차례 머물렀습니다. 지금은 음악사의 명작이 된 오페라 ‘피델리오’와 여러 피아노 작품을 이곳에서 작업했습니다. 음악이 처음부터 세계적인 걸작이었","lat":48.2131,"lon":16.3619,"source":"https://www.wien.info/en/art-culture/music-stage-shows/beethoven-memorials-340698","extra":"https://www.wien.info/en/art-culture/music-stage-shows/beethoven-memorials-340698"},{"id":"VS97","name":"Uhrenmuseum","title":"시계 속에 남아 있는 비엔나의 700년","address":"Schulhof 2","story":"작은 골목의 시계박물관에는 다양한 시대의 시계 수백 점이 전시되어 있습니다. 특히 슈테판 대성당에서 쓰였던 거대한 옛 시계 장치도 만날 수 있습니다. 시간이 일정한 숫자로 흐르는 것이 당연해 보이지만, 도시의 시민들이 같은 시간을 공유하게 되는 과정은 긴 역사를 필요로 했습니다. 시계 하나로 과학과 일상의 변화를 읽어보세요.\n\n도시가 시간을 공유하기 시작하는 데는 의외로 많은 기술이 필요했습니다. 시계박물관에서 특히 주목할 것은 슈테판 대성당의 옛 대형 탑시계 기계장치입니다. 비엔나 시립박물관에 따르면 이 철제 장치는 약 700kg이며 1700년부터 1861년까지 대성당 남쪽 탑에서 작동했습니다. 제작 당시 두 개의 바늘을 도입하면서 시민들은 시뿐 아니라 더 세밀한 시간의 흐름도 볼 수 있게 됐습니다. 초기에는 관리인이 시계의 오차를 보정하고 종소리를 담당해야 했습니다. 이 밖에도 700점 이상의 시계와 달력·천문을 계산하는 기구가 있어 ‘시간은 어떻게 모두의 약속이 됐을까?’라는 질문을 던지게 합니다.","excerpt":"작은 골목의 시계박물관에는 다양한 시대의 시계 수백 점이 전시되어 있습니다. 특히 슈테판 대성당에서 쓰였던 거대한 옛 시계 장치도 만날 수 있습니다. 시간이 일정한 숫자로 흐르는 것이 당연해 보이지","lat":48.21065,"lon":16.3693,"source":"https://www.wienmuseum.at/uhrenmuseum","extra":"https://www.wienmuseum.at/uhrenmuseum"}];
const VN52_INTRO={"id":"intro","name":"Wien – Eine Stadt stellt sich vor","title":"빨강·흰색 깃발이 알려주는 비엔나의 비밀","address":"비엔나 전역","excerpt":"비엔나 골목의 빨강·흰색 깃발은 그 건물에 담긴 역사를 소개하는 관광 안내 표식입니다.","story":"비엔나 골목의 오래된 건물에는 작고 가느다란 빨강·흰색 깃발이 걸려 있곤 합니다. 이 장식은 역사·문화적으로 의미가 있는 장소를 소개하는 비엔나의 관광 안내 표식입니다.\n\n1956년 비엔나 페스티벌을 계기로 시작된 ‘Wien – Eine Stadt stellt sich vor’(비엔나, 도시가 자신을 소개합니다) 사업은 여행객들이 평범해 보이는 건물 속 역사를 발견하도록 돕기 위해 마련됐습니다.\n\n음악가가 잠시 머물렀던 집, 합스부르크 가문의 궁전, 오래된 전설이 전해지는 골목까지. 깃발을 발견한다면 걸음을 멈추고 건물을 한번 바라보세요. 그 자체가 작은 역사책일 수 있습니다.\n\n이 표식은 법률상 문화재 지정과 다릅니다. 아래 이야기 속 건물들의 안내판 설치 상태는 모두 개별 검증된 것이 아니며, 역사적 사실과 전설은 구분해 소개합니다.","source":"https://www.wien.info/en"};

function vn53Photo(s,detail=false){
 const entry=VN53_STORY_PHOTOS[s.id];
 if(!entry)return '<span class="vn52-icon">'+vn52Icon(s)+'</span>';
 return `<span class="vn53-photo ${detail?'vn53-photo-large':''}"><img src="${h(entry.url)}" alt="${h(entry.subject)}" loading="${detail?'eager':'lazy'}" decoding="async" referrerpolicy="no-referrer" onerror="this.hidden=true;this.parentElement.classList.add('vn53-photo-failed')" /><span class="vn53-fallback" aria-hidden="true">${vn52Icon(s)}</span></span>`;
}

function vn54ContextPhoto(s){const x=VN54_STORY_CONTEXT[s.id];if(!x)return '';return `<figure class="vn53-figure vn54-story-figure"><div class="vn54-story-picture"><img loading="lazy" decoding="async" referrerpolicy="no-referrer" src="${h(x.url)}" alt="${h(x.caption)}" onerror="this.hidden=true;this.parentElement.classList.add('vn54-image-failed')" /><div class="vn54-image-fallback">관련 자료 이미지를 불러오지 못했습니다. 아래 원본 링크에서 확인하세요.</div></div><figcaption>② 이야기 속 장면 · ${h(x.caption)} · <a target="_blank" rel="noopener noreferrer" href="${h(x.source)}">원본 · 저작자 · 라이선스 ↗</a></figcaption></figure>`}
function vn52Get(id){return id==='intro'?VN52_INTRO:VN52_STORIES.find(x=>x.id===id)||VN52_INTRO}
function vn52Icon(s){return s.id==='intro'?'<span class="vn52-flags"><i></i><i></i><i></i></span>':s.id==='VS17'?'✧':['VS1','VS11','VS94'].includes(s.id)?'♫':'⌂'}
function vn52Maps(s){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.name+', '+s.address+', Wien Austria')}
function vn52Card(s){return `<button type="button" class="vn52-card" data-act="vn52-open" data-id="${h(s.id)}">${vn53Photo(s)}<span class="vn52-cardtext"><b>${h(s.title)}</b><small>${h(s.excerpt.slice(0,98))}…</small></span><span class="vn52-arrow">›</span></button>`}
function vn52Preview(){return `<section class="vn52-preview"><div class="row between"><b class="sectionheading">비엔나 이야기</b><button class="backbtn" data-act="vn52-list">더보기 →</button></div><div class="vn52-items">${[VN52_INTRO,vn52Get('VS17'),vn52Get('VS1'),vn52Get('VS94')].map(vn52Card).join('')}</div></section>`}
function vn52List(){return `<div class="stack vn52-page"><div class="vn52-bar"><button class="backbtn" data-act="vn52-back">← 홈</button><b>비엔나 이야기</b></div><h2>골목마다 숨은 비엔나의 이야기</h2><p class="sub">역사와 전설을 품은 장소 ${VN52_STORIES.length}곳을 소개합니다.</p>${vn52Card(VN52_INTRO)}<div class="vn52-items">${VN52_STORIES.map(vn52Card).join('')}</div><p class="tiny">개별 건물의 역사 자료를 바탕으로 썼습니다. 빨강·흰색 표식의 현재 설치 여부는 별도 확인이 필요합니다.</p><button class="btn outline block" data-act="vn52-map">내주변에서 위치 보기</button></div>`}
function vn52Detail(){const s=vn52Get(state.vn52Id);return `<div class="stack vn52-page"><div class="vn52-bar"><button class="backbtn" data-act="vn52-back">← 돌아가기</button><b>비엔나 이야기</b></div><article class="vn52-article"><div class="vn52-hero"><div><small>${h(s.name)}</small><h2>${h(s.title)}</h2></div></div><figure class="vn53-figure">${vn53Photo(s,true)}<figcaption>① 장소 사진 · <a href="${h(VN53_STORY_PHOTOS[s.id]?.source||'https://commons.wikimedia.org')}" target="_blank" rel="noopener noreferrer">원본 · 저작자 · 라이선스 ↗</a></figcaption></figure>${vn54ContextPhoto(s)}${s.id==='intro'?'':`<p class="vn52-location">⌖ ${h(s.address)} · 비엔나 1구</p>`}<div class="vn52-body">${s.story.split(/\n\s*\n/).filter(Boolean).map(p=>`<p>${h(p)}</p>`).join('')}</div>${s.id==='intro'?'':`<a class="btn outline block" target="_blank" rel="noopener noreferrer" href="${h(vn52Maps(s))}">Google 지도에서 주소 확인 ↗</a>`}<div class="vn52-source"><b>출처</b>${s.source?`<a target="_blank" rel="noopener noreferrer" href="${h(s.source)}">역사적 사실 참고 자료 ↗</a>`:''}${s.extra&&s.extra!==s.source?`<a target="_blank" rel="noopener noreferrer" href="${h(s.extra)}">추가 자료 ↗</a>`:''}<p>안내판의 현존과 원문은 별도 확인이 필요하며, 지도 핀은 건물 주변 참고 좌표입니다.</p></div></article></div>`}
function vn52MapPins(){
 if(!map||!layerGroup)return;
 const entries=VN52_STORIES.filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon)).map(p=>({
  key:p.id,title:p.title,lat:p.lat,lon:p.lon,type:'sights',action:'vn52-open',
  popup:`<div class="vn52-popup">${vn53Photo(p)}<b>${h(p.title)}</b><small>${h(p.name)} · ${h(p.address)}</small><p>${h(p.excerpt.slice(0,95))}…</p><button data-act="vn52-open" data-id="${h(p.id)}" class="btn navy small">이야기 읽기</button><a target="_blank" rel="noopener noreferrer" href="${h(vn52Maps(p))}">주소 확인 ↗</a></div>`
 }));
 if(entries.length)map.fitBounds(L.latLngBounds(entries.map(p=>[p.lat,p.lon])).pad(.17),{maxZoom:15});
 vn60Clusters(entries,{label:'비엔나 이야기'});
}

t">원래 일정 확인</button></div>`:''}${livePreviewPage()}<div class="quickgrid"><button class="quickcard" data-act="go-result"><span class="qicon">🗓️</span><b>오늘 일정</b><span>남은 장소와 경로</span></button><button class="quickcard" data-act="facility-shortcut" data-value="wc"><span class="qicon">🚻</span><b>화장실 찾기</b><span>공공시설 지도</span></button><button class="quickcard" data-act="facility-shortcut" data-value="water"><span class="qicon">💧</span><b>물 보충 장소</b><span>동절기 운영 유의</span></button><button class="quickcard" data-act="go-guide"><span class="qicon">📘</span><b>여행정보</b><span>교통·현지 규칙</span></button></div><p class="notice-info">현재 위치를 자동 추적하지 않습니다. 예약은 입력값이며 실시간 확인하지 않습니다. 완료 버튼은 사용자 진행 기록만 바꿉니다.</p><button class="btn outline block" data-act="stop-live">여행 준비 화면으로 전환</button></div>`;
  }

  ${vn52Preview()}
  <div class="row between"><b class="sectionheading">여행 준비 정보</b><button class="backbtn" data-act="go-guide">비엔나 가이드 →</button></div>
  <p class="footer">운영시간·예약·사진 정보는 방문 전에 공식 사이트에서 재확인해 주세요. 지도상 일부 관광지 좌표는 정밀 검증 전입니다.</p></div>`;

}
function editPage(){
 const draft=state.editDraft;
 if(!draft||!state.itinerary){state.planView=state.itinerary?'result':'basic';return itinerary();}
 const d=Math.max(0,Math.min(state.days-1,state.currentDay));state.currentDay=d;
 const dates=tripDates(state.date,state.days),ids=draft.days[d]||[],used=new Set(draft.days.flat());
 const missing=selected().filter(p=>!used.has(p.id));
 const fixed=state.fixedEvents.filter(ev=>ev.date===dates[d]);
 const preview=state.editPreviewOpen?buildEditedItinerary({places:selected(),referencePlaces:PLACES,firstDate:state.date,days:state.days,windows:state.dayWindows,events:state.fixedEvents,pace:state.pace,options:state.options,routeOverrides:state.routeOverrides,opening,estimate:driveEstimate,manualPlan:draft}):null;
 const editRows=ids.map((id,i)=>{let p=byId(id);if(!p)return '';
  const select=`<select class="mini-select" aria-label="${h(p.ko)} 방문 날짜 변경" data-edit-move="${h(id)}">${dates.map((date,di)=>`<option value="${di}" ${di===d?'selected':''}>${di+1}일차</option>`).join('')}</select>`;
  return `<div class="edit-row"><div class="row between"><b>${h(p.ko)}</b><span class="pill gray">${i+1}번째</span></div><div class="tiny">${h(p.de)} · ${h((state.options[id]&&p.options.find(o=>o.mode===state.options[id])?.label)||p.options[0].label)}</div><div class="edit-actions"><button class="miniopt" data-act="edit-up" data-id="${h(id)}" ${i===0?'disabled':''} aria-label="${h(p.ko)} 순서 위로">↑ 앞</button><button class="miniopt" data-act="edit-down" data-id="${h(id)}" ${i===ids.length-1?'disabled':''} aria-label="${h(p.ko)} 순서 아래로">↓ 뒤</button>${select}<button class="miniopt danger" data-act="edit-remove" data-id="${h(id)}">제외</button></div></div>`;
 }).join('');

const DEFAULT_WINDOW = Object.freeze({start:'09:30',end:'18:00'});

function vnCourseMiniMap41(course){
 const pts=vnCoursePoints41(course);
 if(pts.length<2)return '<div class="vn41-mini-empty">위치가 확인된 경유지가 충분하지 않아 지도를 표시하지 않습니다.</div>';
 const w=340,hgt=228,pad=28;
 const ringGeoPts=VN_RING_GEO42.flatMap(segment=>segment.map(([lon,lat])=>({lon,lat})));
 const fitted=pts.concat(ringGeoPts);
 let lats=fitted.map(x=>x.lat),lons=fitted.map(x=>x.lon);
 let minLat=Math.min(...lats),maxLat=Math.max(...lats),minLon=Math.min(...lons),maxLon=Math.max(...lons);
 const dLat=Math.max(.008,maxLat-minLat),dLon=Math.max(.012,maxLon-minLon);
 minLat-=dLat*.13;maxLat+=dLat*.13;minLon-=dLon*.16;maxLon+=dLon*.16;
 const midLat=(minLat+maxLat)/2,lonScale=Math.cos(midLat*Math.PI/180);
 const physicalW=(maxLon-minLon)*lonScale,physicalH=maxLat-minLat;
 const factor=Math.min((w-2*pad)/physicalW,(hgt-2*pad)/physicalH);
 const toXY=p=>[w/2+(p.lon-(minLon+maxLon)/2)*lonScale*factor,hgt/2-(p.lat-(minLat+maxLat)/2)*factor];
 const coords=pts.map(toXY);
 const poly=coords.map(x=>x.map(v=>v.toFixed(1)).join(',')).join(' ');
 // Official Vienna street-graph Ringstrasse geometry; no stylized ellipse.
 // Convert real longitude/latitude with exactly the same toXY as the tour stops.
 const rings=VN_RING_GEO42.map(segment=>`<polyline points="${segment.map(([lon,lat])=>toXY({lon,lat}).map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#9aac9d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".80"/>`).join('');
 const markers=coords.map(([x,y],i)=>`<g><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10" fill="#173f51" stroke="#fff" stroke-width="2"/><text x="${x.toFixed(1)}" y="${(y+3.5).toFixed(1)}" text-anchor="middle" fill="white" font-size="10" font-weight="750">${pts[i].order}</text></g>`).join('');

/* Phase 60: shared pixel-distance clustering for all Nearby map categories.
   The route layer is restored after each redraw to preserve route semantics. */
function vn60Clusters(records,{label='장소',route=null,focusId=null}={}){
 if(!map||!layerGroup)return;
 const all=records.filter(p=>Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lon))).map(p=>({...p,lat:Number(p.lat),lon:Number(p.lon)}));
 const maxZoom=19;
 function draw(){
  if(!map||!layerGroup)return;
  layerGroup.clearLayers();
  if(route?.length>1)L.polyline(route,{color:'#16786d',weight:3,opacity:.88,dashArray:'5 8'}).addTo(layerGroup);
  const zoom=map.getZoom(),radius=zoom<13?62:zoom<16?49:28,clusters=[];
  for(const p of all){
   const pt=map.project([p.lat,p.lon],zoom);
   const cluster=clusters.find(c=>Math.hypot(c.x-pt.x,c.y-pt.y)<radius);
   if(!cluster){clusters.push({x:pt.x,y:pt.y,items:[p]});continue;}
   cluster.items.push(p);
   const n=cluster.items.length;cluster.x+=(pt.x-cluster.x)/n;cluster.y+=(pt.y-cluster.y)/n;
  }
  for(const group of clusters){
   if(group.items.length===1){
    const p=group.items[0];
    const marker=L.marker([p.lat,p.lon],{icon:p.icon||nearPin31(p.type||'sights',p.order),title:p.title||p.name||label,riseOnHover:true}).addTo(layerGroup);
    marker.bindPopup(p.popup||'<b>'+h(p.title||p.name||label)+'</b>',{maxWidth:270,autoPan:true});
    if(focusId&&p.key===focusId)marker.openPopup();
    continue;
   }
   const loc=map.unproject(L.point(group.x,group.y),zoom);
   const n=group.items.length;
   const icon=L.divIcon({className:'vn35-cluster-wrap',html:'<span class="vn35-cluster"><span class="vn35-cluster-num">'+n+'</span></span>',iconSize:[42,42],iconAnchor:[21,21]});
   const marker=L.marker(loc,{icon,keyboard:true,title:n+'개 '+label}).addTo(layerGroup);
   marker.on('click',()=>{

async function apiWalkingLeg(from,to){
  const url='/api/route?'+new URLSearchParams({from:from.id,to:to.id}).toString();
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),14000);
  try{
    const response=await fetch(url,{headers:{Accept:'application/json'},signal:controller.signal});
    const data=await response.json().catch(()=>({status:'error',message:'서버가 JSON을 반환하지 않았습니다.'}));
    if(!response.ok||data.status!=='ok')throw Error(data.message||`도보 경로 조회 HTTP ${response.status}`);
    if(data.from!==from.id||data.to!==to.id||data.mode!=='walking'||!Number.isInteger(data.durationMinutes)||data.durationMinutes<1||data.durationMinutes>180)throw Error('경로 응답 검증 실패');
    return {minutes:data.durationMinutes,mode:'walking',source:'ors-walking',savedAt:data.checkedAt||new Date().toISOString(),distanceMeters:data.distanceMeters,locationStatus:'approximate-venue-coordinates'};
  }finally{clearTimeout(timer)}
}

window.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(state.expDetail19){state.expDetail19=null;state.expPlan19=null;render()}else if(state.explore19){state.explore19=false;render()}else if(state.settingsOpen){state.settingsOpen=false;render()}else if(state.detail){state.detail=null;render()}else if(state.routeEdit){state.routeEdit=null;render()}else if(state.guideTopic){state.guideTopic=null;render()}else if(state.homeGuide){state.homeGuide=false;state.guideTopic=null;render()}else if(state.homeView==='explore'){state.homeView='overview';render()}});
render();


</script></body></html>
